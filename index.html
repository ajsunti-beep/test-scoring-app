<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบประเมินผลงานวิจัยภาคบรรยาย</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=Noto+Serif+Thai:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');

  :root{
    --bg:#F7F9FC;
    --card:#FFFFFF;
    --blue:#1B4B91;
    --blue-2:#2E6BB8;
    --orange:#E8722C;
    --orange-light:#FCE6D3;
    --green:#3F7857;
    --green-bg:#E7F1EA;
    --red:#B5473A;
    --red-bg:#FBEAE7;
    --text:#24272E;
    --muted:#767A82;
    --border:#E1E6EE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Mali','Noto Sans Thai','Noto Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:980px;margin:0 auto;padding:28px 20px 60px;}

  header.top{
    background:var(--blue);
    color:#fff;
    border-radius:16px;
    padding:52px 30px 28px;
    margin-bottom:22px;
    min-height:116px;
    position:relative;
    overflow:hidden;
  }
  header.top .header-inner{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
  }
  .org-logo{
    height:64px;
    width:auto;
    display:block;
    object-fit:contain;
  }
  header.top .org-logo{
    position:absolute;
    top:14px;
    left:22px;
    height:92px;
    width:auto;
  }
  header.top h1{
    font-family:'Mali','Noto Serif Thai',serif;
    font-weight:600;
    font-size:22px;
    margin:0 0 4px;
    line-height:1.4;
  }
  header.top p{
    margin:0;
    font-size:13.5px;
    color:#C7CEDD;
    line-height:1.6;
  }
  .header-org-line{
    font-weight:600;
    color:#FDDCC0 !important;
    letter-spacing:.2px;
  }
  .weight-strip{
    display:flex;
    height:10px;
    border-radius:6px;
    overflow:hidden;
    margin-top:18px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.15);
  }
  .weight-strip span{display:block;height:100%;}
  .weight-legend{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin-top:10px;
    font-size:11.5px;
    color:#B9C1D4;
  }
  .weight-legend b{
    display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle;
  }
  .identity-strip{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
    min-height:20px;
  }
  .identity-strip:empty{
    display:none;
    margin-bottom:0;
  }
  .identity-strip span{
    font-size:11.5px;
    color:var(--muted);
    background:var(--card);
    border:1px solid var(--border);
    padding:5px 10px;
    border-radius:20px;
  }
  .identity-strip a{
    color:var(--blue);
    text-decoration:underline;
    font-weight:600;
    font-size:11.5px;
  }

  .back-link{
    display:inline-flex;
    align-items:center;
    font-size:15px;
    font-weight:600;
    color:var(--blue);
    text-decoration:none;
    margin-bottom:14px;
    padding:10px 18px;
    border:2px solid var(--blue);
    border-radius:10px;
    background:#fff;
    transition:all .15s;
  }
  .back-link:hover{background:var(--blue);color:#fff;}

  .group-banner{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--orange-light);
    color:#8A4A14;
    border-radius:10px;
    padding:10px 16px;
    font-size:13px;
    margin-bottom:16px;
  }
  .group-banner strong{font-weight:700;}

  .judge-info-strip{
    background:var(--orange-light);
    color:#8A4A14;
    font-size:13.5px;
    font-weight:600;
    padding:9px 16px;
    border-radius:8px;
    margin-bottom:18px;
    text-align:center;
  }

  .icon-menu{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    margin-top:6px;
  }
  .icon-tile{
    flex:1;
    min-width:220px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:44px 24px;
    text-align:center;
    cursor:pointer;
    transition:all .15s;
  }
  .icon-tile:hover{
    border-color:var(--orange);
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(27,75,145,0.10);
  }
  .icon-tile .icon-circle{
    width:72px;height:72px;
    border-radius:50%;
    background:var(--orange-light);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 18px;
    color:var(--blue);
  }
  .icon-tile .icon-circle svg{ width:34px; height:34px; }
  .icon-tile h3{
    font-family:'Mali','Noto Serif Thai',serif;
    font-size:16.5px;
    color:var(--blue);
    margin:0;
    font-weight:600;
  }

  nav.tabs{
    display:flex;
    gap:8px;
    margin-bottom:20px;
  }
  nav.tabs button{
    flex:1;
    padding:12px 10px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--muted);
    font-family:inherit;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    transition:all .15s;
  }
  nav.tabs button.active{
    background:var(--blue);
    color:#fff;
    border-color:var(--blue);
  }
  nav.tabs button:not(.active):hover{
    border-color:var(--orange);
    color:var(--blue);
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px 24px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:'Mali','Noto Serif Thai',serif;
    font-size:17px;
    font-weight:600;
    margin:0 0 14px;
    color:var(--blue);
  }
  .card h3{
    font-size:14px;
    font-weight:600;
    margin:0 0 4px;
    color:var(--blue);
  }

  label.field-label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:5px;
    font-weight:500;
  }
  input[type="text"], select{
    width:100%;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#F5F8FC;
    font-family:inherit;
    font-size:14px;
    color:var(--text);
  }
  input[type="text"]:focus, select:focus{
    outline:none;
    border-color:var(--orange);
    background:#fff;
  }
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:160px;}

  button.btn{
    font-family:inherit;
    font-size:14px;
    font-weight:500;
    padding:10px 18px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    transition:opacity .15s;
  }
  button.btn:hover{opacity:.88;}
  button.btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-gold{background:var(--orange);color:#6B350F;}
  .btn-ghost{background:transparent;color:var(--red);border:1px solid var(--red-bg);}
  .btn-ghost:hover{background:var(--red-bg);}
  .btn-outline{background:transparent;color:var(--blue);border:1px solid var(--border);}
  .btn-outline:hover{background:var(--bg);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{
    text-align:left;
    color:var(--muted);
    font-weight:500;
    font-size:12px;
    padding:8px 10px;
    border-bottom:1px solid var(--border);
  }
  td{
    padding:10px;
    border-bottom:1px solid var(--border);
    vertical-align:middle;
  }
  tr:last-child td{border-bottom:none;}

  .badge{
    display:inline-block;
    font-size:11.5px;
    font-weight:600;
    padding:3px 9px;
    border-radius:20px;
  }
  .badge-done{background:var(--green-bg);color:var(--green);}
  .badge-pending{background:var(--orange-light);color:#8A4A14;}
  .badge-conflict{background:var(--red-bg);color:var(--red);}
  .warn-icon{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:16px;height:16px;
    border-radius:50%;
    background:var(--red);
    color:#fff;
    font-size:11px;
    font-weight:700;
    margin-right:5px;
    vertical-align:middle;
    flex-shrink:0;
  }

  .empty{
    text-align:center;
    padding:36px 10px;
    color:var(--muted);
    font-size:13.5px;
  }

  .group-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 4px;
    border-bottom:1px solid var(--border);
    gap:12px;
    flex-wrap:wrap;
  }
  .group-card:last-child{border-bottom:none;}
  .group-card .gc-info strong{font-size:14.5px;color:var(--blue);}
  .group-card .gc-meta{font-size:12px;color:var(--muted);margin-top:3px;}
  .group-card .gc-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .judge-picker{display:flex;gap:8px;margin-bottom:16px;}
  .judge-picker button{
    flex:1;
    padding:10px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#F5F8FC;
    font-family:inherit;
    font-size:13.5px;
    font-weight:500;
    color:var(--muted);
    cursor:pointer;
  }
  .judge-picker button.active{
    background:var(--orange-light);
    border-color:var(--orange);
    color:#8A4A14;
  }
  .locked-judge-banner{
    background:var(--orange-light);
    color:#8A4A14;
    border-radius:10px;
    padding:12px 16px;
    font-size:13.5px;
    margin-bottom:16px;
  }
  .judge-name-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--border);
  }
  .judge-name-row:last-child{border-bottom:none;}
  .judge-name-row .jn-label{
    font-size:13px;
    color:var(--muted);
    width:110px;
    flex-shrink:0;
  }
  .judge-name-row input[type="text"]{flex:1;}
  .link-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:6px;
    flex-wrap:wrap;
  }
  .link-row input[type="text"]{
    flex:1;
    min-width:160px;
    font-size:12px;
    color:var(--muted);
    background:var(--bg);
  }

  .dim-block{margin-bottom:22px;}
  .dim-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:2px solid var(--blue);
    padding-bottom:6px;
    margin-bottom:12px;
  }
  .dim-head h3{margin:0;}
  .dim-head span{font-size:12px;color:var(--muted);}

  .indicator{
    padding:12px 0;
    border-bottom:1px solid var(--border);
  }
  .indicator:last-child{border-bottom:none;}
  .ind-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:4px;
  }
  .ind-top strong{font-size:13.5px;}
  .ind-top span{font-size:11.5px;color:var(--muted);}
  .ind-desc{font-size:13.5px;color:#2A2E38;line-height:1.6;margin:0 0 10px;font-weight:500;}

  .level-picker{display:flex;gap:8px;}
  .level-btn{
    flex:1;
    padding:9px 6px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#F5F8FC;
    font-family:inherit;
    font-size:12.5px;
    font-weight:600;
    color:#3A3D44;
    cursor:pointer;
    text-align:center;
    line-height:1.4;
  }
  .level-btn small{display:block;font-size:10.5px;font-weight:500;opacity:.85;color:#5A5E66;}
  .level-btn.active{
    background:var(--blue);
    border-color:var(--blue);
    color:#fff;
  }
  .level-btn.active small{color:#fff;}
  .level-btn:disabled{
    cursor:not-allowed;
    opacity:.55;
  }
  .level-btn.active:disabled{
    opacity:.8;
  }

  .total-bar{
    position:sticky;
    bottom:0;
    background:var(--blue);
    color:#fff;
    border-radius:12px;
    padding:14px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:6px;
  }
  .total-bar .num{font-family:'Mali','Noto Serif Thai',serif;font-size:22px;font-weight:600;color:var(--orange-light);}
  .total-bar .lbl{font-size:16px;font-weight:600;color:#E4E9F3;}

  .toast{
    text-align:center;
    font-size:13px;
    color:var(--green);
    margin-top:10px;
    min-height:18px;
  }

  .rank-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:24px;height:24px;
    border-radius:50%;
    background:var(--orange-light);
    color:#8A4A14;
    font-size:12px;
    font-weight:700;
  }
  .avg-total{font-family:'Mali','Noto Serif Thai',serif;font-weight:600;font-size:15px;color:var(--blue);}
  .detail-panel{
    background:#F5F8FC;
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    margin-top:8px;
    font-size:12.5px;
  }
  .detail-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--border);}
  .detail-row:last-child{border-bottom:none;font-weight:600;}
  .score-detail-table{ width:100%; table-layout:fixed; }
  .score-detail-table th, .score-detail-table td{
    word-break:break-word;
    overflow-wrap:anywhere;
    line-height:1.3;
    vertical-align:middle;
  }
  .score-detail-table th:first-child, .score-detail-table td:first-child{ width:26%; text-align:left; }
  .score-detail-table th:nth-child(2), .score-detail-table th:nth-child(3), .score-detail-table th:nth-child(4){ width:17%; }
  .score-detail-table th:nth-child(5), .score-detail-table th:nth-child(6){ width:11%; }

  @media (max-width:640px){
    .row > div{min-width:100%;}
    .judge-picker{flex-wrap:wrap;}
    .level-picker{flex-direction:column;}
    .group-card{flex-direction:column;align-items:flex-start;}
    .welcome-hero{padding:36px 22px !important;}
    header.top{padding:78px 18px 22px;min-height:0;}
    header.top .org-logo{top:12px;left:16px;height:56px;}
  }

  .welcome-hero{
    background:linear-gradient(160deg, var(--blue) 0%, var(--blue-2) 60%, #34406b 100%);
    color:#fff;
    border-radius:20px;
    padding:56px 48px;
    text-align:center;
    margin-bottom:22px;
    position:relative;
    overflow:hidden;
  }
  .welcome-hero .org-logo{
    height:110px;
    width:auto;
    margin:0 auto 18px;
  }
  .welcome-hero::before{
    content:'';
    position:absolute;
    top:-60px; right:-60px;
    width:220px; height:220px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(173,138,50,0.35) 0%, rgba(173,138,50,0) 70%);
  }
  .welcome-org{
    font-family:'Mali','Noto Serif Thai',serif;
    font-size:34px;
    font-weight:700;
    color:#fff;
    margin:0 0 14px;
    line-height:1.4;
  }
  .welcome-title{
    font-family:'Mali','Noto Serif Thai',serif;
    font-weight:600;
    font-size:19px;
    line-height:1.6;
    color:var(--orange-light);
    margin:0;
    max-width:560px;
    margin-left:auto;
    margin-right:auto;
  }
  .login-card{
    max-width:380px;
    margin:0 auto;
  }
  .login-card h2{ text-align:center; }
  .login-error{
    background:var(--red-bg);
    color:var(--red);
    border-radius:8px;
    padding:10px 14px;
    font-size:13px;
    margin-bottom:12px;
    display:none;
  }
  .login-error.show{ display:block; }
  .login-success{
    background:var(--green-bg);
    color:var(--green);
    border-radius:8px;
    padding:10px 14px;
    font-size:13px;
    margin-bottom:12px;
    display:none;
  }
  .login-success.show{ display:block; }
  .login-forgot-link{
    display:block;
    text-align:right;
    font-size:12.5px;
    color:var(--muted);
    margin-top:8px;
  }
  .login-forgot-link:hover{ color:var(--orange); }
  .login-back-link{
    display:inline-block;
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:12px;
  }
  .login-back-link:hover{ color:var(--orange); }

  #printReportRoot{ display:none; }
  .report-title{ font-family:'TH Sarabun PSK','TH Sarabun New','Sarabun',sans-serif; font-weight:700; font-size:20pt; margin:0 0 4px; color:#000; }
  .report-subtitle{ font-family:'TH Sarabun PSK','TH Sarabun New','Sarabun',sans-serif; font-weight:700; font-size:17pt; margin:0 0 4px; color:#000; }
  .report-meta{ font-size:14pt; color:#333; margin:0 0 10px; }
  .report-table{ width:100%; border-collapse:collapse; font-size:16pt; margin-bottom:10px; color:#000; }
  .report-table th, .report-table td{ border:1px solid #999; padding:4px 6px; text-align:left; }
  .report-table th{ text-align:center; }
  .sig-block{ margin-top:12px; display:flex; flex-direction:column; gap:10px; }
  .sig-row{ text-align:center; }
  .sig-line-row{ display:flex; align-items:flex-end; justify-content:center; gap:6px; font-size:13px; margin-bottom:5px; }
  .sig-underline{ display:inline-block; width:210px; height:2cm; border-bottom:1px solid #333; position:relative; }
  .sig-image{ position:absolute; bottom:2px; left:50%; transform:translateX(-50%); height:1.85cm; max-width:200px; object-fit:contain; }
  .sig-name{ font-size:12px; }
  .sig-date{ font-size:11px; margin-top:3px; color:#333; }

  @media print {
    body{ background:#fff; }
    .wrap{ display:none !important; }
    #printReportRoot{ display:block !important; padding:10px 16px; font-family:'TH Sarabun PSK','TH Sarabun New','Sarabun',sans-serif; color:#000; }
    .report-page{ page-break-after:always; }
    .report-page:last-child{ page-break-after:auto; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="headerWrap">
    <div class="identity-strip" id="identityBadge"></div>
    <header class="top" id="appHeader">
      <div class="header-inner">
        <img class="org-logo" id="headerLogo" alt="ตราคุรุสภา">
        <div>
          <h1 style="text-align:center;margin:0;">ระบบประเมินคุณภาพการนำเสนอผลงานวิจัยภาคบรรยาย</h1>
          <p class="header-org-line" style="text-align:center;margin:6px 0 0;">สำนักงานเลขาธิการคุรุสภา สำนักพัฒนาและส่งเสริมวิชาชีพ</p>
        </div>
      </div>
    </header>
  </div>

  <div id="app"></div>

</div>

<div id="printReportRoot"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBw_-iqQoJ1-XtJMNcrUrOw98K86HE1ldk",
  authDomain: "oral-presentation-2569-test.firebaseapp.com",
  projectId: "oral-presentation-2569-test",
  storageBucket: "oral-presentation-2569-test.firebasestorage.app",
  messagingSenderId: "415232235035",
  appId: "1:415232235035:web:eca33737fc420bac0c4abe",
  measurementId: "G-LHYQXXSDGN"
};
firebase.initializeApp(firebaseConfig);
const fsDb = firebase.firestore();
/* In-app browsers (LINE, Facebook, Instagram, etc.) often block or mishandle the
   streaming connection (WebChannel) Firestore uses by default — the request just
   hangs forever with no error, which is exactly what "ค้างที่กำลังบันทึก... ไม่ขึ้น
   ข้อความอะไรเลย" looks like. Forcing long-polling (plain HTTP requests instead of a
   long-lived stream) is Firebase's documented workaround and is far more compatible
   with restricted mobile in-app browsers, at a small latency cost. */
fsDb.settings({ experimentalAutoDetectLongPolling: true, merge: true });
const fsAuth = firebase.auth();

/* Drop-in replacement for the old window.storage API, backed by Firestore.
   Same call signature (key, shared) so the rest of the app is unchanged;
   "shared" is accepted but ignored since every key in this app is shared data. */
const storage = {
  async get(key, shared){
    const snap = await fsDb.collection('kvstore').doc(key).get();
    if(!snap.exists) return null;
    return { key, value: snap.data().value, shared: true };
  },
  async set(key, value, shared){
    await fsDb.collection('kvstore').doc(key).set({ value: value, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });

/* Tracks whether the score form has unsaved picks — used to warn before the
   picks get lost silently (closing the tab, or tapping a back link) since the
   level-picker buttons only update in-memory state until "บันทึกคะแนน" is pressed. */
function isScoreFormDirty(){
  if(currentTab !== 'score' || judgeScoreSubView !== 'form') return false;
  return JSON.stringify(scoreLevels) !== JSON.stringify(lastSavedScoreLevels || {});
}
window.addEventListener('beforeunload', (e)=>{
  if(isScoreFormDirty()){
    e.preventDefault();
    e.returnValue = '';
  }
});
/* Shows an inline (not native-dialog) confirmation before navigating away from
   a dirty score form — consistent with the two-step inline confirm pattern used
   elsewhere in this app instead of window.confirm(). */
function confirmLeaveIfDirty(proceedFn){
  if(!isScoreFormDirty()){ proceedFn(); return; }
  const toast = document.getElementById('scoreToast');
  if(!toast){ proceedFn(); return; }
  toast.style.color = 'var(--red)';
  toast.innerHTML = `คุณยังไม่ได้กดบันทึกคะแนนที่เลือกไว้ หากออกจากหน้านี้ตอนนี้ คะแนนที่เลือกจะหายไป
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-outline" id="confirmLeaveBtn">ออกโดยไม่บันทึก</button>
      <button class="btn btn-gold" id="cancelLeaveBtn">อยู่หน้านี้ต่อ</button>
    </div>`;
  /* The warning lives next to "บันทึกคะแนน" at the bottom of a (often long)
     form. If the click that triggered this came from the link at the TOP of
     the page instead, the warning would render off-screen with nothing visibly
     happening — so always scroll it into view regardless of which link fired it. */
  toast.scrollIntoView({ behavior:'smooth', block:'center' });
  document.getElementById('confirmLeaveBtn').onclick = ()=> proceedFn();
  document.getElementById('cancelLeaveBtn').onclick = ()=>{ toast.style.color=''; toast.innerHTML=''; };
}
/* Lightweight append-only edit history per group, capped so it can't grow
   forever. Best-effort: never blocks or fails the action it's logging for. */
async function logAudit(groupId, action, detail){
  try{
    const who = (authUser && displayNameForEmail(authUser.email)) || (lockedJudge ? judgeLabel(lockedJudge) : (previewJudge ? `${judgeLabel(previewJudge)} (พรีวิว)` : 'ไม่ทราบผู้ใช้'));
    const r = await storage.get(`auditLog:${groupId}`, true);
    let log = r ? JSON.parse(r.value) : [];
    log.push({ action, detail, by: who, at: Date.now() });
    if(log.length > 300) log = log.slice(log.length - 300);
    await storage.set(`auditLog:${groupId}`, JSON.stringify(log), true);
  }catch(e){ /* audit logging must never block the real action */ }
}
async function loadAuditLogFor(groupId){
  try{
    const r = await storage.get(`auditLog:${groupId}`, true);
    return r ? JSON.parse(r.value) : [];
  }catch(e){ return []; }
}
async function saveAuditLogFor(groupId, log){
  await storage.set(`auditLog:${groupId}`, JSON.stringify(log), true);
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
/* Races a promise against a timeout. Firestore writes made while offline (or on a
   flaky mobile connection) queue locally and simply never resolve until connectivity
   returns — with no error and no built-in timeout — so a save can appear to hang
   forever with no feedback. This wraps a save so the UI can tell the user what's
   going on instead of sitting on "กำลังบันทึก..." indefinitely. */
function withTimeout(promise, ms, timeoutMessage){
  let timer;
  const timeout = new Promise((_, reject)=>{
    timer = setTimeout(()=> reject(Object.assign(new Error(timeoutMessage||'หมดเวลา'), { code:'client/timeout' })), ms);
  });
  return Promise.race([promise, timeout]).finally(()=> clearTimeout(timer));
}
function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s==null ? '' : s;
  return d.innerHTML;
}
/* Sanitizes text typed/pasted into email & username fields: converts fullwidth
   characters (e.g. a Thai/mobile keyboard's "＠" instead of "@") to their normal
   ASCII form, strips invisible zero-width characters that sometimes ride along
   with copy-pasted text, and trims. Without this, a field can look correct to
   the eye but fail an "@" check because the character typed isn't really "@". */
function cleanInput(s){
  return (s==null ? '' : s).normalize('NFKC').replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
}
/* If someone mixes up the "email" and "username" boxes (a common slip — e.g. typing
   the email into the username field and vice versa), this detects it from the "@"
   and swaps them back automatically instead of just failing with a validation error. */
function autoFixEmailUsername(email, username){
  const emailHasAt = email.includes('@');
  const usernameHasAt = username.includes('@');
  if(!emailHasAt && usernameHasAt){
    return { email: username, username: email, swapped: true };
  }
  return { email, username, swapped: false };
}

/* ---------- electronic signature pad ---------- */
function setupSignaturePad(canvasId){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle = '#1B4B91';
  ctx.lineWidth = 2.4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  canvas._hasDrawing = false;
  let drawing = false;
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width/rect.width;
    const scaleY = canvas.height/rect.height;
    return { x: (e.clientX-rect.left)*scaleX, y: (e.clientY-rect.top)*scaleY };
  }
  canvas.onpointerdown = (e)=>{
    drawing = true;
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    const p = getPos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  };
  canvas.onpointermove = (e)=>{
    if(!drawing) return;
    const p = getPos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    canvas._hasDrawing = true;
  };
  const stop = ()=>{ drawing = false; };
  canvas.onpointerup = stop;
  canvas.onpointercancel = stop;
  canvas.onpointerleave = stop;
}
function clearSignaturePad(canvasId){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  canvas._hasDrawing = false;
}
function isSignaturePadEmpty(canvasId){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return true;
  return !canvas._hasDrawing;
}
/* Reads a user-picked image file (e.g. a photo of a wet-ink signature) and
   downscales it onto a canvas before exporting as a dataURL — keeps the stored
   signature small (Firestore doc size, load time) even if the original photo
   from a phone camera is several MB. Flattens transparency to white so it looks
   consistent with the hand-drawn signature pad. */
function readImageFileToDataURL(file, maxDim){
  maxDim = maxDim || 500;
  return new Promise((resolve, reject)=>{
    if(!file.type || !file.type.startsWith('image/')){
      reject(Object.assign(new Error('invalid file type'), { code:'client/invalid-file-type' }));
      return;
    }
    if(file.size > 8*1024*1024){
      reject(Object.assign(new Error('file too large'), { code:'client/file-too-large' }));
      return;
    }
    const reader = new FileReader();
    reader.onerror = ()=> reject(Object.assign(reader.error || new Error('read failed'), { code:'client/file-read-error' }));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(Object.assign(new Error('invalid image'), { code:'client/invalid-image' }));
      img.onload = ()=>{
        let w = img.naturalWidth, h = img.naturalHeight;
        const scale = Math.min(1, maxDim / Math.max(w, h));
        w = Math.max(1, Math.round(w*scale));
        h = Math.max(1, Math.round(h*scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/png'));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
/* Removes a light/plain background from an uploaded signature photo and crops
   tightly to the remaining ink, so uploaded signatures end up similarly sized
   (and dark enough to print clearly) as drawn ones. Uses adaptive thresholding
   (not true AI segmentation): rather than assuming a single flat background
   color, it estimates a LOCAL background at every pixel by heavily
   downscaling the image (which erases thin signature strokes but keeps the
   broad paper color/lighting) and comparing each pixel to that blurred map —
   this correctly handles shadows, uneven lighting, and off-white paper.
   Pixels that differ enough from their local background are kept fully
   opaque and darkened toward black so faint pen strokes still print clearly.
   May not fully remove strongly textured or multi-colored backgrounds. */
function removeBackgroundAndCropDataURL(dataUrl, padding){
  padding = padding==null ? 6 : padding;
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      const w = img.naturalWidth, h = img.naturalHeight;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;

      // Local background map: downscale drastically (erases pen strokes,
      // keeps broad lighting/paper color) then scale back up as a blur.
      const small = document.createElement('canvas');
      const sw = Math.max(8, Math.round(w/20)), sh = Math.max(8, Math.round(h/20));
      small.width = sw; small.height = sh;
      small.getContext('2d').drawImage(canvas, 0, 0, sw, sh);
      const bgCanvas = document.createElement('canvas');
      bgCanvas.width = w; bgCanvas.height = h;
      const bgCtx = bgCanvas.getContext('2d');
      bgCtx.imageSmoothingEnabled = true;
      bgCtx.drawImage(small, 0, 0, w, h);
      const bgData = bgCtx.getImageData(0, 0, w, h).data;

      // Distance of each pixel's color from its LOCAL background estimate.
      // Small distance = background (goes transparent); larger distance =
      // ink (kept fully opaque and darkened so it prints clearly).
      const DIST_LIGHT = 22; // at/below this distance -> fully background
      const DIST_FULL = 40;  // at/above this distance -> fully opaque ink
      for(let i=0; i<data.length; i+=4){
        const dr=data[i]-bgData[i], dg=data[i+1]-bgData[i+1], db=data[i+2]-bgData[i+2];
        const dist = Math.sqrt(dr*dr+dg*dg+db*db);
        let t; // 0 = background, 1 = full ink
        if(dist <= DIST_LIGHT) t = 0;
        else if(dist >= DIST_FULL) t = 1;
        else t = (dist-DIST_LIGHT)/(DIST_FULL-DIST_LIGHT);
        // Color is set to solid black and ONLY alpha carries how ink-like a
        // pixel is (no extra per-pixel color darkening on top of that). This
        // keeps the stroke's true width/tone gradient faithful to the
        // original — thin or lightly-inked areas stay visually thin/faint,
        // solid dark areas stay solid — rather than both effects compounding
        // and visually fattening every detected stroke.
        data[i+3] = Math.round(t*255);
        if(t > 0){
          data[i] = 0; data[i+1] = 0; data[i+2] = 0;
        }
      }
      ctx.putImageData(imgData, 0, 0);

      // Discard small/isolated speckles (JPEG noise, paper dust, ink shadow
      // blobs near a pen-lift point) that passed the color threshold but
      // aren't really part of the signature: find connected blobs of opaque
      // pixels, then keep only ones that are a substantial fraction of the
      // largest blob's size — genuine separate strokes (an underline, a
      // dot, a second letter) are normally a meaningful size, while leftover
      // noise/shadow blobs tend to be small even when they sit right next
      // to a real stroke, so position alone can't reliably tell them apart.
      (function denoise(){
        const total = w*h;
        const visited = new Uint8Array(total);
        const blobs = [];
        for(let sy=0; sy<h; sy++){
          for(let sx=0; sx<w; sx++){
            const sp = sy*w+sx;
            if(visited[sp] || data[sp*4+3] <= 10) continue;
            const stack = [sp];
            visited[sp] = 1;
            let count=0;
            const pixels = [];
            while(stack.length){
              const cur = stack.pop();
              const cx = cur % w, cy = (cur / w) | 0;
              count++;
              pixels.push(cur);
              for(let dy=-1; dy<=1; dy++){
                for(let dx=-1; dx<=1; dx++){
                  if(dx===0 && dy===0) continue;
                  const nx=cx+dx, ny=cy+dy;
                  if(nx<0||nx>=w||ny<0||ny>=h) continue;
                  const np = ny*w+nx;
                  if(!visited[np] && data[np*4+3] > 10){
                    visited[np] = 1;
                    stack.push(np);
                  }
                }
              }
            }
            blobs.push({ pixels, count });
          }
        }
        if(blobs.length <= 1) return;
        blobs.sort((a,b)=> b.count - a.count);
        const minKeep = Math.max(30, Math.round(blobs[0].count * 0.15));
        for(let bi=1; bi<blobs.length; bi++){
          const b = blobs[bi];
          if(b.count >= minKeep) continue;
          for(const p of b.pixels){ data[p*4+3] = 0; }
        }
      })();
      ctx.putImageData(imgData, 0, 0);
      let minX=w, minY=h, maxX=-1, maxY=-1;
      for(let y=0; y<h; y++){
        for(let x=0; x<w; x++){
          if(data[(y*w+x)*4+3] > 10){
            if(x<minX) minX=x;
            if(x>maxX) maxX=x;
            if(y<minY) minY=y;
            if(y>maxY) maxY=y;
          }
        }
      }
      if(maxX<0){ resolve(canvas.toDataURL('image/png')); return; }
      minX = Math.max(0, minX-padding);
      minY = Math.max(0, minY-padding);
      maxX = Math.min(w-1, maxX+padding);
      maxY = Math.min(h-1, maxY+padding);
      const cropW = maxX-minX+1, cropH = maxY-minY+1;
      const out = document.createElement('canvas');
      out.width = cropW; out.height = cropH;
      out.getContext('2d').drawImage(canvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
      resolve(out.toDataURL('image/png'));
    };
    img.onerror = ()=> resolve(dataUrl);
    img.src = dataUrl;
  });
}
/* Crops the signature canvas tightly around the drawn strokes so the exported
   image has minimal blank space and sits snug against the signature line. */
function trimCanvasToDataURL(canvasId, padding){
  padding = padding==null ? 2 : padding;
  const canvas = document.getElementById(canvasId);
  if(!canvas) return null;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const data = ctx.getImageData(0,0,w,h).data;
  let minX=w, minY=h, maxX=-1, maxY=-1;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const alpha = data[(y*w+x)*4+3];
      if(alpha>10){
        if(x<minX) minX=x;
        if(x>maxX) maxX=x;
        if(y<minY) minY=y;
        if(y>maxY) maxY=y;
      }
    }
  }
  if(maxX<0) return canvas.toDataURL('image/png');
  minX = Math.max(0, minX-padding);
  minY = Math.max(0, minY-padding);
  maxX = Math.min(w-1, maxX+padding);
  maxY = Math.min(h-1, maxY+padding);
  const cropW = maxX-minX+1, cropH = maxY-minY+1;
  const out = document.createElement('canvas');
  out.width = cropW;
  out.height = cropH;
  out.getContext('2d').drawImage(canvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
  return out.toDataURL('image/png');
}

/* Accepts either a username or a raw email (for accounts created before usernames
   existed, or typed directly by someone who prefers it). Returns the real email
   to authenticate with, or null if a username was given but not found. */
function resolveLoginEmail(input){
  const v = (input||'').trim();
  if(!v) return null;
  if(v.includes('@')) return v;
  const hit = usernameMap[v.toLowerCase()];
  return hit || null;
}
function usernameForEmail(email){
  if(!email) return null;
  const found = Object.entries(usernameMap).find(([u,e])=> e.toLowerCase()===email.toLowerCase());
  return found ? found[0] : null;
}
function displayNameForEmail(email){
  return usernameForEmail(email) || email;
}

async function saveJudgeSignatureAtomic(groupId, judge, sigEntry){
  // Signatures for all 3 judges of a group live in ONE shared document, so a
  // plain read-then-write from a browser tab that loaded the document earlier
  // can clobber a signature another judge saved in the meantime. Use a
  // Firestore transaction so the merge (read + update + write) is atomic and
  // always based on the latest server state, never a stale local copy.
  const docRef = fsDb.collection('kvstore').doc(`judgeSignatures:${groupId}`);
  const merged = await fsDb.runTransaction(async (tx)=>{
    const snap = await tx.get(docRef);
    let current = { 1:null, 2:null, 3:null };
    if(snap.exists && snap.data().value){
      try{ current = { 1:null, 2:null, 3:null, ...JSON.parse(snap.data().value) }; }catch(e){}
    }
    current[judge] = sigEntry;
    tx.set(docRef, { value: JSON.stringify(current), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    return current;
  });
  return merged;
}

async function loadAllScoresFor(workId){
  const results = {};
  const pairs = await Promise.all(JUDGES.map(async j => [j, await loadScore(workId, j)]));
  for(const [j, score] of pairs){ results[j] = score; }
  return results;
}
/* Loads scores for many works at once (all works × all judges fetched in
   parallel) instead of awaiting each work/judge one at a time in sequence.
   This is the main fix for pages getting slower as more works accumulate:
   sequential awaits meant N works took N round-trips one after another. */
async function loadAllScoresForWorks(works){
  const pairs = await Promise.all(works.map(async w => [w.id, await loadAllScoresFor(w.id)]));
  const map = {};
  for(const [id, scores] of pairs){ map[id] = scores; }
  return map;
}

async function pushRowsToSheets(groupId, sheetName, headers, dataRows){

    let iframe = document.getElementById('sheetsSyncFrame');

      iframe.name = 'sheetsSyncFrame';

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = url;
    form.target = 'sheetsSyncFrame';
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'payload';
    input.value = JSON.stringify({ sheet: sheetName, headers, rows: dataRows });
    form.appendChild(input);
    document.body.appendChild(form);
    form.submit();
    document.body.removeChild(form);
    return { ok:true };
  }catch(err){
    return { ok:false, error: String(err) };
  }
}
const SCORE_ROW_HEADERS = ['บันทึกเมื่อ','กลุ่ม','รหัสผลงานวิจัย','ผู้นำเสนอ','กรรมการ', ...RUBRIC.flatMap(d=>d.indicators.map(i=>i.id)), 'คะแนนรวม'];
function buildScoreRow(groupName, work, judgeName, levels){
  return [
    new Date().toISOString(), groupName, work.title, work.presenter||'',
    judgeName,
    ...RUBRIC.flatMap(d=>d.indicators.map(i=>levels[i.id]!=null ? levels[i.id] : '')),
    computeTotal(levels)
  ];
}
const SUMMARY_ROW_HEADERS = ['บันทึกเมื่อ','กลุ่ม','รหัสผลงานวิจัย','ผู้นำเสนอ','คะแนนรวม','คะแนนระดับภูมิภาค','สรุปผลคะแนนระดับประเทศ','สรุปผลการประเมินระดับประเทศ'];
function buildSummaryRow(groupName, work, result, nationalTotal, grade){
  return [
    new Date().toISOString(), groupName, work.title, work.presenter||'',
    result.total!==null ? result.total : '',
    work.regionalScore!=null ? work.regionalScore : '',
    nationalTotal!==null ? nationalTotal : '',
    grade || ''
  ];
}
async function gatherAllScoreAndSummaryRows(){
  const scoreRows = [];
  const summaryRows = [];
  const scoresByWork = await loadAllScoresForWorks(ctxWorks);
  for(const w of ctxWorks){
    const scores = scoresByWork[w.id];
    JUDGES.forEach(j=>{
      if(scores[j] && isComplete(scores[j].levels)){
        scoreRows.push(buildScoreRow(ctxGroupName, w, judgeLabel(j), scores[j].levels));
      }
    });
    const result = computeWorkResult(scores);
    const nationalTotal = computeNationalTotal(w, result);
    const grade = nationalGrade(nationalTotal);
    summaryRows.push(buildSummaryRow(ctxGroupName, w, result, nationalTotal, grade));
  }
  return { scoreRows, summaryRows };
}
function csvEscapeCell(v){
  const s = v===null || v===undefined ? '' : String(v);
  if(/[",\n\r]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function rowsToCsv(headers, rows){
  const lines = [headers, ...rows].map(row => row.map(csvEscapeCell).join(','));
  return '\uFEFF' + lines.join('\r\n');
}
function downloadCsvFile(filename, csvContent){
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });
  const blobUrl = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = blobUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(blobUrl), 5000);
}

/* ---------- helpers ---------- */
function effectiveJudge(){ return lockedJudge || previewJudge; }
function judgeLabel(n){
  return (ctxJudgeNames[n] && ctxJudgeNames[n].trim()) ? ctxJudgeNames[n].trim() : `กรรมการคนที่ ${n}`;
}
function judgeLinkFor(groupId, n){
  return `${window.location.origin}${window.location.pathname}?group=${groupId}&judge=${n}`;
}
function modeOf(vals){
  const count = {};
  vals.forEach(v=>count[v]=(count[v]||0)+1);
  let best = null, bestCount = 1;
  for(const v in count){
    if(count[v] > bestCount){ bestCount = count[v]; best = Number(v); }
  }
  return best;
}
function computeTotal(levels){
  let total = 0;
  for(const dim of RUBRIC){
    for(const ind of dim.indicators){
      const lvl = levels[ind.id];
      if(lvl) total += lvl * ind.weight;
    }
  }
  return Math.round(total*100)/100;
}
function isComplete(levels){
  for(const dim of RUBRIC) for(const ind of dim.indicators) if(!levels[ind.id]) return false;
  return true;
}
function computeWorkResult(scores){
  // A work is "resolved" per-indicator as soon as a majority level exists among
  // whichever judges have scored so far — i.e. 2 of 3 judges agreeing is already
  // final, since a 3rd vote can never overturn a 2-vote majority. This lets scores
  // finalize even if one judge is unable to complete their duty.
  const doneCount = JUDGES.filter(j=>scores[j] && isComplete(scores[j].levels)).length;
  const allDone = doneCount === JUDGES.length;
  const indicators = [];
  const conflicts = [];
  RUBRIC.forEach(dim=>{
    dim.indicators.forEach(ind=>{
      const judgeLevels = JUDGES.map(j=> (scores[j] && scores[j].levels[ind.id]) ? scores[j].levels[ind.id] : null);
      const nonNull = judgeLevels.filter(v=>v!=null);
      const mode = nonNull.length>=2 ? modeOf(nonNull) : null;
      // "conflict" = all 3 judges have scored yet no majority exists (genuine tie, needs discussion)
      const conflict = mode===null && nonNull.length===JUDGES.length;
      if(conflict) conflicts.push(ind.id);
      const score = mode!==null ? mode*ind.weight : null;
      indicators.push({ id:ind.id, name:ind.name, dimName:dim.name, weight:ind.weight, judgeLevels, mode, score, conflict });
    });
  });
  const resolved = indicators.every(ind=>ind.score!==null);
  const total = resolved ? Math.round(indicators.reduce((s,i)=>s+i.score,0)*100)/100 : null;
  return { allDone, doneCount, indicators, conflicts, total, resolved };
}

function computeNationalTotal(work, res){
  if(res.total===null) return null;
  if(work.regionalScore===null || work.regionalScore===undefined || isNaN(work.regionalScore)) return null;
  return Math.round((work.regionalScore + res.total)*100)/100;
}

function nationalGrade(score){
  if(score===null) return null;
  if(score>=90 && score<=100) return 'ดีเด่น';
  if(score>=84.5 && score<90) return 'ดี';
  if(score>=80 && score<84.5) return 'ชมเชย';
  if(score<80) return 'ไม่ผ่านเกณฑ์';
  return null;
}

function renderVisitorsList(){
  const wrap = document.getElementById('visitorsListWrap');
  if(!wrap) return;
  if(visitors.length===0){
    wrap.innerHTML = `<div class="empty">ยังไม่มีผู้เยี่ยมชม</div>`;
    return;
  }
  wrap.innerHTML = visitors.map(v=>`<div class="group-card" id="visrow-${encodeURIComponent(v.email)}"></div>`).join('');
  visitors.forEach(v=>{
    const row = document.getElementById(`visrow-${encodeURIComponent(v.email)}`);
    if(!row) return;
    row.innerHTML = `
      <div class="gc-info">
        <strong>${escapeHtml(v.username || v.email)}</strong>
        <div class="gc-meta">ดูได้อย่างเดียว · ทุกกลุ่ม${v.username ? ` · ${escapeHtml(v.email)}` : ''}</div>
      </div>
      <div class="gc-actions">
        <button class="btn btn-ghost" data-delvis="${escapeHtml(v.email)}">ลบสิทธิ์ผู้เยี่ยมชม</button>
      </div>
    `;
    const delBtn = row.querySelector('button[data-delvis]');
    let confirming = false;
    let revertTimer = null;
    delBtn.onclick = async ()=>{
      if(!confirming){
        confirming = true;
        delBtn.textContent = 'ยืนยันการลบ?';
        delBtn.style.background = 'var(--red)';
        delBtn.style.color = '#fff';
        delBtn.style.borderColor = 'var(--red)';
        revertTimer = setTimeout(()=>{
          confirming = false;
          delBtn.textContent = 'ลบสิทธิ์ผู้เยี่ยมชม';
          delBtn.style.background = '';
          delBtn.style.color = '';
          delBtn.style.borderColor = '';
        }, 4000);
        return;
      }
      clearTimeout(revertTimer);
      visitors = visitors.filter(x=>x.email.toLowerCase()!==v.email.toLowerCase());
      await saveVisitors();
      renderVisitorsList();
    };
  });
}

      <p style="font-size:12.5px;color:var(--red);margin:-2px 0 14px;">⚠️ ใช้เฉพาะกรณีฉุกเฉิน (เช่น ข้อมูลหาย/เสียหาย) เท่านั้น การนำเข้าจะ<strong>เขียนทับ</strong>ข้อมูลปัจจุบันของกลุ่มที่ตรงกัน — กลุ่มที่มีอยู่แล้วในไฟล์สำรองแต่ไม่มีในระบบตอนนี้จะถูกสร้างขึ้นใหม่ กรุณาตรวจสอบไฟล์ให้แน่ใจก่อนนำเข้า</p>
      <input type="file" id="restoreFileInput" accept="application/json,.json" style="display:block;margin-bottom:12px;">
      <div id="restorePreviewWrap"></div>
      <div class="toast" id="restoreToast"></div>
    </div>
    ` : ''}
  `;
  document.getElementById('saveEvalYearBtn').onclick = async ()=>{
    const val = document.getElementById('evalYearInput').value.trim();
    const toast = document.getElementById('evalYearToast');
    if(!val){
      toast.style.color = 'var(--red)';
      toast.textContent = 'กรุณากรอกปีที่ประเมิน';
      return;
    }
    evalYear = val;
    await saveEvalYear();
    toast.style.color = 'var(--green)';
    toast.textContent = `บันทึกปีที่ประเมิน พ.ศ. ${val} แล้ว`;
  };
  document.getElementById('addGroupBtn').onclick = async ()=>{
    const name = document.getElementById('newGroupName').value.trim();
    const btn = document.getElementById('addGroupBtn');
    const original = btn.textContent;
    if(!name){ document.getElementById('newGroupName').focus(); return; }
    if(groups.some(g=>g.name.trim().toLowerCase()===name.toLowerCase())){
      btn.textContent = 'มีชื่อกลุ่มนี้อยู่แล้ว กรุณาใช้ชื่ออื่น';
      btn.style.background = 'var(--red)';
      setTimeout(()=>{ btn.textContent = original; btn.style.background = ''; }, 2200);
      return;
    }
    const newGroup = { id: uid(), name };
    groups.push(newGroup);
    await saveGroups();
    logAudit('_global', 'add_group', `เพิ่มกลุ่ม "${name}"`).catch(()=>{});
    renderApp();
  };
  if(canManageBackup) document.getElementById('downloadBackupBtn').onclick = async ()=>{
    const btn = document.getElementById('downloadBackupBtn');
    const toast = document.getElementById('backupToast');
    const original = btn.textContent;
    btn.textContent = 'กำลังรวบรวมข้อมูล...';
    btn.disabled = true;
    toast.textContent = '';
    try{
      const backup = {
        exportedAt: new Date().toISOString(),
        evalYear,
        groups: []
      };
      for(const g of groups){
        const [names, pins, works, signatures, certifyApproved, auditLog] = await Promise.all([
          loadJudgeNamesFor(g.id),
          loadJudgePinsFor(g.id),
          loadWorksFor(g.id),
          loadJudgeSignaturesFor(g.id),
          loadCertifyApprovedFor(g.id),
          loadAuditLogFor(g.id)
        ]);
        const worksWithScores = [];
        const scoresByWork = await loadAllScoresForWorks(works);
        for(const w of works){
          const scores = scoresByWork[w.id];
          worksWithScores.push({ ...w, scores });
        }
        backup.groups.push({
          id: g.id, name: g.name,
          judgeNames: names, judgePins: pins,
          certifyApproved, judgeSignatures: signatures,
          works: worksWithScores, auditLog
        });
      }
      const json = JSON.stringify(backup, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
      a.href = url;
      a.download = `backup-oral-presentation-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast.style.color = 'var(--green)';
      toast.textContent = `ดาวน์โหลดข้อมูลสำรอง ${groups.length} กลุ่มเรียบร้อยแล้ว`;
    }catch(err){
      toast.style.color = 'var(--red)';
      toast.textContent = 'สร้างไฟล์สำรองไม่สำเร็จ กรุณาลองใหม่อีกครั้ง';
      console.error('backup failed:', err);
    }
    btn.textContent = original;
    btn.disabled = false;
  };
  if(canManageBackup) document.getElementById('restoreFileInput').onchange = (e)=>{
    const file = e.target.files && e.target.files[0];
    const previewWrap = document.getElementById('restorePreviewWrap');
    const toast = document.getElementById('restoreToast');
    toast.textContent = '';
    previewWrap.innerHTML = '';
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      let backup;
      try{
        backup = JSON.parse(reader.result);
      }catch(err){
        toast.style.color = 'var(--red)';
        toast.textContent = 'ไฟล์นี้ไม่ใช่ JSON ที่ถูกต้อง หรือไฟล์เสียหาย';
        return;
      }
      if(!backup || !Array.isArray(backup.groups)){
        toast.style.color = 'var(--red)';
        toast.textContent = 'ไฟล์นี้ไม่ตรงกับรูปแบบไฟล์สำรองของระบบนี้';
        return;
      }
      const existingIds = new Set(groups.map(g=>g.id));
      const newCount = backup.groups.filter(g=>!existingIds.has(g.id)).length;
      const overwriteCount = backup.groups.length - newCount;
      const totalWorks = backup.groups.reduce((s,g)=>s + (Array.isArray(g.works)?g.works.length:0), 0);
      previewWrap.innerHTML = `
        <div style="background:var(--orange-light);border-radius:8px;padding:12px 14px;font-size:13px;margin-bottom:12px;">
          ไฟล์นี้มีข้อมูล <strong>${backup.groups.length} กลุ่ม</strong> (${totalWorks} ผลงานรวมกัน)
          ${overwriteCount>0 ? `<br>— <strong style="color:var(--red);">${overwriteCount} กลุ่มจะถูกเขียนทับ</strong> (มีอยู่แล้วในระบบตอนนี้)` : ''}
          ${newCount>0 ? `<br>— ${newCount} กลุ่มเป็นข้อมูลใหม่ (จะถูกสร้างขึ้น)` : ''}
          ${backup.exportedAt ? `<br>สำรองไว้เมื่อ: ${new Date(backup.exportedAt).toLocaleString('th-TH')}` : ''}
        </div>
        <button class="btn btn-ghost" id="restoreConfirmBtn">นำเข้าข้อมูล</button>
      `;
      let confirming = false;
      let revertTimer = null;
      const confirmBtn = document.getElementById('restoreConfirmBtn');
      confirmBtn.onclick = async ()=>{
        if(!confirming){
          confirming = true;
          confirmBtn.textContent = 'ยืนยันการนำเข้า? (จะเขียนทับข้อมูลที่ซ้ำกัน)';
          confirmBtn.style.background = 'var(--red)';
          confirmBtn.style.color = '#fff';
          confirmBtn.style.borderColor = 'var(--red)';
          revertTimer = setTimeout(()=>{
            confirming = false;
            confirmBtn.textContent = 'นำเข้าข้อมูล';
            confirmBtn.style.background = '';
            confirmBtn.style.color = '';
            confirmBtn.style.borderColor = '';
          }, 4000);
          return;
        }
        clearTimeout(revertTimer);
        confirmBtn.disabled = true;
        confirmBtn.textContent = 'กำลังนำเข้า...';
        toast.textContent = '';
        try{
          for(const g of backup.groups){
            if(!existingIds.has(g.id)){
              groups.push({ id: g.id, name: g.name });
            } else {
              const existing = groups.find(x=>x.id===g.id);
              if(existing) existing.name = g.name;
            }
            const worksForSave = (g.works||[]).map(w=>({ id:w.id, title:w.title, presenter:w.presenter, regionalScore: w.regionalScore!=null?w.regionalScore:null }));
            await saveWorksFor(g.id, worksForSave);
            for(const w of (g.works||[])){
              if(!w.scores) continue;
              for(const judge of JUDGES){
                const sc = w.scores[judge];
                if(sc) await saveScore(w.id, judge, sc);
              }
            }
            if(g.judgeNames) await saveJudgeNamesFor(g.id, g.judgeNames);
            if(g.judgePins) await saveJudgePinsFor(g.id, g.judgePins);
            if(g.judgeSignatures) await saveJudgeSignaturesFor(g.id, g.judgeSignatures);
            if(typeof g.certifyApproved === 'boolean') await saveCertifyApprovedFor(g.id, g.certifyApproved);
            if(Array.isArray(g.auditLog)) await saveAuditLogFor(g.id, g.auditLog);
          }
          await saveGroups();
          logAudit('_global', 'restore_backup', `นำเข้าข้อมูลจากไฟล์สำรอง (${backup.groups.length} กลุ่ม, สำรองไว้เมื่อ ${backup.exportedAt||'ไม่ทราบ'})`).catch(()=>{});
          toast.style.color = 'var(--green)';
          toast.textContent = `นำเข้าข้อมูล ${backup.groups.length} กลุ่มเรียบร้อยแล้ว`;
          previewWrap.innerHTML = '';
          document.getElementById('restoreFileInput').value = '';
          renderApp();
        }catch(err){
          toast.style.color = 'var(--red)';
          toast.textContent = 'นำเข้าข้อมูลไม่สำเร็จบางส่วน กรุณาตรวจสอบข้อมูลและลองใหม่ (ข้อมูลที่นำเข้าไปแล้วก่อนเกิดข้อผิดพลาดจะยังอยู่)';
          console.error('restore failed:', err);
          confirmBtn.disabled = false;
          confirmBtn.textContent = 'นำเข้าข้อมูล';
        }
      };
    };
    reader.readAsText(file);
  };
  await renderGroupsList();
}

async function renderGroupsList(){
  const wrap = document.getElementById('groupsListWrap');
  if(groups.length===0){
    wrap.innerHTML = `<div class="empty">ยังไม่มีกลุ่มการประเมิน เพิ่มกลุ่มแรกด้านบน</div>`;
    return;
  }
  wrap.innerHTML = groups.map(g=>`<div class="group-card" id="grow-${g.id}"></div>`).join('');
  for(const g of groups){
    const jn = await loadJudgeNamesFor(g.id);
    const w = await loadWorksFor(g.id);
    const namedCount = JUDGES.filter(n=>jn[n] && jn[n].trim()).length;
    renderGroupRow(g, w.length, namedCount);
  }
}

function renderGroupRow(g, workCount, namedCount){
  const row = document.getElementById(`grow-${g.id}`);
  if(!row) return;
  row.innerHTML = `
    <div class="gc-info">
      <strong>${escapeHtml(g.name)}</strong>
      <div class="gc-meta">ผลงาน ${workCount} เรื่อง · ตั้งชื่อกรรมการแล้ว ${namedCount}/3</div>
    </div>
    <div class="gc-actions">
      <button class="btn btn-primary" data-open="${g.id}">เข้าใช้งานกลุ่มนี้</button>
      <button class="btn btn-outline" data-edit="${g.id}">แก้ไขชื่อ</button>
      <button class="btn btn-ghost" data-del="${g.id}">ลบกลุ่ม</button>
    </div>
  `;
  row.querySelector(`button[data-open="${g.id}"]`).onclick = ()=> openGroupWorkspace(g.id, g.name);
  row.querySelector(`button[data-edit="${g.id}"]`).onclick = ()=> renderGroupRowEdit(g, workCount, namedCount);
  const delBtn = row.querySelector(`button[data-del="${g.id}"]`);
  let confirming = false;
  let revertTimer = null;
  delBtn.onclick = async ()=>{
    if(!confirming){
      confirming = true;
      delBtn.textContent = 'ยืนยันการลบ?';
      delBtn.style.background = 'var(--red)';
      delBtn.style.color = '#fff';
      delBtn.style.borderColor = 'var(--red)';
      revertTimer = setTimeout(()=>{
        confirming = false;
        delBtn.textContent = 'ลบกลุ่ม';
        delBtn.style.background = '';
        delBtn.style.color = '';
        delBtn.style.borderColor = '';
      }, 4000);
      return;
    }
    clearTimeout(revertTimer);
    groups = groups.filter(x=>x.id!==g.id);
    await saveGroups();
    logAudit('_global', 'delete_group', `ลบกลุ่ม "${g.name}"`).catch(()=>{});
    renderApp();
  };
}

function renderGroupRowEdit(g, workCount, namedCount){
  const row = document.getElementById(`grow-${g.id}`);
  if(!row) return;
  row.innerHTML = `
    <div class="gc-info" style="flex:1;min-width:220px;">
      <label class="field-label" style="margin-bottom:6px;">ชื่อกลุ่ม</label>
      <input type="text" id="editGroupName-${g.id}" value="${escapeHtml(g.name)}">
    </div>
    <div class="gc-actions">
      <button class="btn btn-primary" data-savename="${g.id}">บันทึก</button>
      <button class="btn btn-outline" data-cancel="${g.id}">ยกเลิก</button>
    </div>
  `;
  const input = document.getElementById(`editGroupName-${g.id}`);
  input.focus();
  input.select();
  row.querySelector(`button[data-savename="${g.id}"]`).onclick = async ()=>{
    const newName = input.value.trim();
    if(!newName){ input.focus(); return; }
    const found = groups.find(x=>x.id===g.id);
    if(found) found.name = newName;
    await saveGroups();
    renderGroupRow({ ...g, name:newName }, workCount, namedCount);
  };
  row.querySelector(`button[data-cancel="${g.id}"]`).onclick = ()=>{
    renderGroupRow(g, workCount, namedCount);
  };
  input.onkeydown = (e)=>{
    if(e.key==='Enter') row.querySelector(`button[data-savename="${g.id}"]`).click();
    if(e.key==='Escape') row.querySelector(`button[data-cancel="${g.id}"]`).click();
  };
}

function renderCertifyApprovedSection(){
  const wrap = document.getElementById('certifyApprovedWrap');
  if(!wrap) return;
  wrap.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <button class="btn ${ctxCertifyApproved ? 'btn-outline' : 'btn-gold'}" id="toggleCertifyBtn">${ctxCertifyApproved ? 'ยกเลิกการอนุมัติ' : 'อนุมัติให้รับรองผลการประเมิน'}</button>
      ${ctxCertifyApproved
        ? `<span class="badge badge-done">อนุมัติแล้ว — กรรมการรับรองผลได้</span>`
        : `<span class="badge badge-pending">ยังไม่อนุมัติ</span>`}
    </div>
    ${ctxCertifyApproved ? `<p style="font-size:11.5px;color:var(--muted);margin:8px 0 0;">การยกเลิกการอนุมัติจะล้างลายมือชื่อรับรองผลของกรรมการทุกท่านในกลุ่มนี้ด้วย</p>` : ''}
  `;
  const btn = document.getElementById('toggleCertifyBtn');
  let confirming = false;
  let revertTimer = null;
  btn.onclick = async ()=>{
    if(ctxCertifyApproved && !confirming){
      // Cancelling approval is destructive (wipes signatures) — require confirm click
      confirming = true;
      btn.textContent = 'ยืนยันการยกเลิก? (จะล้างลายเซ็นทั้งหมด)';
      btn.style.background = 'var(--red)';
      btn.style.color = '#fff';
      btn.style.borderColor = 'var(--red)';
      revertTimer = setTimeout(()=>{
        confirming = false;
        renderCertifyApprovedSection();
      }, 4000);
      return;
    }
    if(revertTimer) clearTimeout(revertTimer);
    btn.disabled = true;
    const wasApproved = ctxCertifyApproved;
    ctxCertifyApproved = !ctxCertifyApproved;
    await saveCertifyApprovedFor(ctxGroupId, ctxCertifyApproved);
    if(wasApproved && !ctxCertifyApproved){
      // Cancelling: clear all judge signatures for this group so previously
      // signed judges no longer see "รับรองผลแล้ว" and must re-sign after re-approval.
      await saveJudgeSignaturesFor(ctxGroupId, { 1:null, 2:null, 3:null });
      logAudit(ctxGroupId, 'cancel_certify', 'ยกเลิกการอนุมัติรับรองผล (ล้างลายเซ็นทุกท่าน)').catch(()=>{});
    } else {
      logAudit(ctxGroupId, 'approve_certify', 'อนุมัติให้กรรมการรับรองผลได้').catch(()=>{});
    }
    renderCertifyApprovedSection();
  };
}

  document.getElementById('syncAllSheetsBtn').onclick = async ()=>{

    const url = document.getElementById('sheetsUrlInput').value.trim();
    if(!url){
      toast.style.color = 'var(--red)';
      toast.textContent = 'กรุณาระบุและบันทึก Web App URL ก่อนซิงก์ข้อมูล';

    }
    await saveSheetsUrlFor(ctxGroupId, url);
    btn.textContent = 'กำลังซิงก์...';
    btn.disabled = true;
    const { scoreRows, summaryRows } = await gatherAllScoreAndSummaryRows();
    try{
      if(scoreRows.length>0) await pushRowsToSheets(ctxGroupId, 'Scores', SCORE_ROW_HEADERS, scoreRows);
      if(summaryRows.length>0) await pushRowsToSheets(ctxGroupId, 'Summary', SUMMARY_ROW_HEADERS, summaryRows);

    }catch(err){
      toast.style.color = 'var(--red)';
      toast.textContent = 'เกิดข้อผิดพลาดระหว่างส่งข้อมูล กรุณาตรวจสอบ URL และลองใหม่';

    btn.textContent = 'ซิงก์ข้อมูลทั้งหมดตอนนี้';
    btn.disabled = false;
  };
  document.getElementById('addWorkBtn').onclick = async ()=>{
    const title = document.getElementById('newTitle').value.trim();
    const presenter = document.getElementById('newPresenter').value.trim();
    const regionalRaw = document.getElementById('newRegional').value.trim();
    const regionalScore = regionalRaw==='' ? null : Math.round(parseFloat(regionalRaw)*100)/100;
    if(!title){ document.getElementById('newTitle').focus(); return; }
    const btn = document.getElementById('addWorkBtn');
    const original = btn.textContent;
    if(ctxWorks.some(x=>x.title.trim().toLowerCase()===title.toLowerCase())){
      btn.textContent = 'มีรหัสผลงานนี้อยู่แล้ว กรุณาใช้รหัสอื่น';
      btn.style.background = 'var(--red)';
      setTimeout(()=>{ btn.textContent = original; btn.style.background = ''; }, 2200);
      return;
    }
    const newWork = { id: uid(), title, presenter, regionalScore: (regionalScore===null || isNaN(regionalScore)) ? null : regionalScore };
    ctxWorks.push(newWork);
    try{
      await saveWorksFor(ctxGroupId, ctxWorks);
      logAudit(ctxGroupId, 'add_work', `เพิ่มผลงาน "${title}" (ผู้นำเสนอ: ${presenter||'-'})`).catch(()=>{});
      document.getElementById('newTitle').value = '';
      document.getElementById('newPresenter').value = '';
      document.getElementById('newRegional').value = '';
      btn.textContent = 'เพิ่มแล้ว ✓';
      btn.style.background = 'var(--green)';
      const countEl = document.getElementById('worksCount');
      if(countEl) countEl.textContent = ctxWorks.length;
      await renderWorksList();
    }catch(err){
      ctxWorks = ctxWorks.filter(w=>w.id!==newWork.id);
      btn.textContent = 'เพิ่มไม่สำเร็จ ลองใหม่อีกครั้ง';
      btn.style.background = 'var(--red)';
    }
    setTimeout(()=>{ btn.textContent = original; btn.style.background = ''; }, 1800);
  };
  await renderWorksList();
}

function renderJudgeNamesCard(){
  const wrap = document.getElementById('judgeNamesWrap');
  wrap.innerHTML = JUDGES.map(n=>`
    <div class="judge-name-row">
      <span class="jn-label">กรรมการคนที่ ${n}</span>
      <input type="text" id="judgeName${n}" value="${escapeHtml(ctxJudgeNames[n]||'')}" placeholder="ระบุชื่อ-สกุลกรรมการ">
      <button class="btn btn-gold" data-save="${n}" style="flex-shrink:0;">บันทึกชื่อ</button>
    </div>
    <div class="link-row">
      <input type="text" readonly id="judgeLink${n}" value="${judgeLinkFor(ctxGroupId, n)}">
      <button class="btn btn-outline" style="flex-shrink:0;" data-copy="${n}">คัดลอกลิงก์ + PIN</button>
      <button class="btn btn-outline" style="flex-shrink:0;" data-preview="${n}">ดูมุมมองนี้</button>
    </div>
    <div class="link-row" style="align-items:center;gap:10px;margin-top:6px;">
      <span style="font-size:12.5px;color:var(--muted);">รหัส PIN สำหรับกรรมการ:</span>
      <strong id="judgePinDisplay${n}" style="font-size:18px;letter-spacing:3px;color:var(--blue);">${escapeHtml(ctxJudgePins[n] || '—')}</strong>
      <button class="btn btn-outline" style="flex-shrink:0;" data-regen="${n}">สุ่ม PIN ใหม่</button>
    </div>
  `).join('');
  JUDGES.forEach(n=>{
    wrap.querySelector(`button[data-save="${n}"]`).onclick = async ()=>{
      ctxJudgeNames[n] = document.getElementById(`judgeName${n}`).value.trim();
      await saveJudgeNamesFor(ctxGroupId, ctxJudgeNames);
      renderWorksList();
    };
    wrap.querySelector(`button[data-preview="${n}"]`).onclick = ()=>{
      enterPreview(n);
    };
    wrap.querySelector(`button[data-regen="${n}"]`).onclick = async (e)=>{
      ctxJudgePins[n] = generatePin();
      await saveJudgePinsFor(ctxGroupId, ctxJudgePins);
      document.getElementById(`judgePinDisplay${n}`).textContent = ctxJudgePins[n];
      const btn = e.currentTarget;
      const original = btn.textContent;
      btn.textContent = 'สุ่มใหม่แล้ว ✓';
      setTimeout(()=>{ btn.textContent = original; }, 1400);
    };
    wrap.querySelector(`button[data-copy="${n}"]`).onclick = async (e)=>{
      const link = judgeLinkFor(ctxGroupId, n);
      const pin = ctxJudgePins[n];
      const text = pin
        ? `ลิงก์สำหรับให้คะแนน: ${link}\nรหัส PIN: ${pin}`
        : link;
      const btn = e.currentTarget;
      const original = btn.textContent;
      try{
        await navigator.clipboard.writeText(text);
        btn.textContent = 'คัดลอกแล้ว';
      }catch(err){
        const input = document.getElementById(`judgeLink${n}`);
        input.select();
        btn.textContent = 'เลือกลิงก์ด้านบนเพื่อคัดลอกเอง';
      }
      setTimeout(()=>{ btn.textContent = original; }, 1800);
    };
  });
  // Auto-generate a PIN for any judge who doesn't have one yet, so the admin
  // always sees something ready to send rather than a blank field.
  const missing = JUDGES.filter(n=>!ctxJudgePins[n]);
  if(missing.length){
    missing.forEach(n=>{ ctxJudgePins[n] = generatePin(); });
    saveJudgePinsFor(ctxGroupId, ctxJudgePins).then(()=>{
      missing.forEach(n=>{
        const el = document.getElementById(`judgePinDisplay${n}`);
        if(el) el.textContent = ctxJudgePins[n];
      });
    });
  }
}

async function renderWorksList(){
  const wrap = document.getElementById('worksListWrap');
  if(ctxWorks.length===0){
    wrap.innerHTML = `<div class="empty">ยังไม่มีผลงานวิจัยในกลุ่มนี้ เพิ่มผลงานเรื่องแรกด้านบน</div>`;
    return;
  }
  wrap.innerHTML = `<div style="overflow-x:auto;"><table style="min-width:680px;"><thead><tr><th>รหัสผลงานวิจัย</th><th>ผู้นำเสนอ</th><th>คะแนนระดับภูมิภาค</th><th>สถานะการให้คะแนน</th><th></th></tr></thead><tbody id="worksTbody"></tbody></table></div>`;
  const tbody = document.getElementById('worksTbody');
  const scoresByWork = await loadAllScoresForWorks(ctxWorks);
  for(const w of ctxWorks){
    const scores = scoresByWork[w.id];
    const res = computeWorkResult(scores);
    let statusHtml;
    if(res.resolved){
      statusHtml = `<span class="badge badge-done">${res.allDone ? 'ครบและสรุปได้แล้ว' : `สรุปผลได้แล้ว (${res.doneCount}/3 กรรมการ)`}</span>`;
    } else if(!res.allDone){
      statusHtml = `<span class="badge badge-pending">${res.doneCount}/3 กรรมการ</span>`;
    } else {
      statusHtml = `<span class="badge badge-conflict"><span class="warn-icon" style="margin-right:4px;">!</span>ไม่มีฐานนิยม ${res.conflicts.length} รายการ</span>`;
    }
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td data-title-cell="${w.id}"><strong>${escapeHtml(w.title)}</strong><br><a href="#" data-editwork="${w.id}" style="font-size:12px;color:var(--orange);">✎ แก้ไข</a></td>
      <td data-presenter-cell="${w.id}" style="color:var(--muted)">${escapeHtml(w.presenter||'-')}</td>
      <td>
        <div style="display:flex;gap:6px;align-items:center;">
          <input type="number" step="0.01" style="width:90px;padding:6px 8px;font-size:13px;" data-regional-input="${w.id}" value="${w.regionalScore!=null ? w.regionalScore : ''}">
          <button class="btn btn-outline" style="padding:6px 10px;font-size:12px;flex-shrink:0;" data-regional-save="${w.id}">บันทึก</button>
        </div>
      </td>
      <td>${statusHtml}</td>
      <td style="white-space:nowrap;" data-actions-cell="${w.id}">
        <button class="btn btn-outline" data-reset="${w.id}" style="margin-right:6px;">รีเซ็ตคะแนน</button>
        <button class="btn btn-ghost" data-id="${w.id}">ลบ</button>
      </td>
    `;
    const editBtn = tr.querySelector(`a[data-editwork="${w.id}"]`);
    editBtn.onclick = (e)=>{
      e.preventDefault();
      const titleCell = tr.querySelector(`td[data-title-cell="${w.id}"]`);
      const presenterCell = tr.querySelector(`td[data-presenter-cell="${w.id}"]`);
      const actionsCell = tr.querySelector(`td[data-actions-cell="${w.id}"]`);
      titleCell.innerHTML = `<input type="text" data-edit-title="${w.id}" value="${escapeHtml(w.title)}" style="width:100%;min-width:120px;">`;
      presenterCell.innerHTML = `<input type="text" data-edit-presenter="${w.id}" value="${escapeHtml(w.presenter||'')}" style="width:100%;min-width:120px;">`;
      actionsCell.innerHTML = `
        <button class="btn btn-gold" data-savework="${w.id}" style="margin-right:6px;">บันทึกการแก้ไข</button>
        <button class="btn btn-outline" data-cancelwork="${w.id}">ยกเลิก</button>
      `;
      const editToast = document.createElement('div');
      editToast.className = 'toast';
      editToast.id = `editWorkToast${w.id}`;
      actionsCell.appendChild(editToast);
      actionsCell.querySelector(`button[data-cancelwork="${w.id}"]`).onclick = ()=> renderWorksList();
      actionsCell.querySelector(`button[data-savework="${w.id}"]`).onclick = async ()=>{
        const newTitle = titleCell.querySelector('input').value.trim();
        const newPresenter = presenterCell.querySelector('input').value.trim();
        const toast = document.getElementById(`editWorkToast${w.id}`);
        if(!newTitle){
          toast.style.color = 'var(--red)';
          toast.textContent = 'กรุณากรอกรหัสผลงานวิจัย';
          return;
        }
        const dup = ctxWorks.some(x=>x.id!==w.id && x.title.trim().toLowerCase()===newTitle.toLowerCase());
        if(dup){
          toast.style.color = 'var(--red)';
          toast.textContent = 'มีรหัสผลงานวิจัยนี้อยู่แล้วในกลุ่มนี้ กรุณาใช้รหัสอื่น';
          return;
        }
        const target = ctxWorks.find(x=>x.id===w.id);
        const prevTitle = target.title, prevPresenter = target.presenter;
        target.title = newTitle;
        target.presenter = newPresenter;
        try{
          await saveWorksFor(ctxGroupId, ctxWorks);
          logAudit(ctxGroupId, 'edit_work', `แก้ไขผลงาน "${prevTitle}" → "${newTitle}"${prevPresenter!==newPresenter ? ` (ผู้นำเสนอ: "${prevPresenter||'-'}" → "${newPresenter||'-'}")` : ''}`).catch(()=>{});
          renderWorksList();
        }catch(err){
          target.title = prevTitle;
          target.presenter = prevPresenter;
          toast.style.color = 'var(--red)';
          toast.textContent = 'บันทึกไม่สำเร็จ กรุณาลองใหม่อีกครั้ง';
        }
      };
    };
    const regInput = tr.querySelector(`input[data-regional-input="${w.id}"]`);
    const regBtn = tr.querySelector(`button[data-regional-save="${w.id}"]`);
    regBtn.onclick = async ()=>{
      const raw = regInput.value.trim();
      const val = raw==='' ? null : Math.round(parseFloat(raw)*100)/100;
      const original = regBtn.textContent;
      const target = ctxWorks.find(x=>x.id===w.id);
      const prevVal = target ? target.regionalScore : null;
      if(target) target.regionalScore = (val===null || isNaN(val)) ? null : val;
      try{
        await saveWorksFor(ctxGroupId, ctxWorks);
        regBtn.textContent = 'บันทึกแล้ว ✓';
        regBtn.style.background = 'var(--green)';
        regBtn.style.color = '#fff';
      }catch(err){
        if(target) target.regionalScore = prevVal;
        regBtn.textContent = 'ไม่สำเร็จ';
        regBtn.style.background = 'var(--red)';
        regBtn.style.color = '#fff';
      }
      setTimeout(()=>{ regBtn.textContent = original; regBtn.style.background=''; regBtn.style.color=''; }, 1500);
    };
    const resetBtn = tr.querySelector(`button[data-reset="${w.id}"]`);
    let resetConfirming = false;
    let resetRevertTimer = null;
    resetBtn.onclick = async ()=>{
      if(!resetConfirming){
        resetConfirming = true;
        resetBtn.textContent = 'ยืนยันรีเซ็ต?';
        resetBtn.style.background = 'var(--red)';
        resetBtn.style.color = '#fff';
        resetBtn.style.borderColor = 'var(--red)';
        resetRevertTimer = setTimeout(()=>{
          resetConfirming = false;
          resetBtn.textContent = 'รีเซ็ตคะแนน';
          resetBtn.style.background = '';
          resetBtn.style.color = '';
          resetBtn.style.borderColor = '';
        }, 4000);
        return;
      }
      clearTimeout(resetRevertTimer);
      resetBtn.textContent = 'กำลังรีเซ็ต...';
      resetBtn.disabled = true;
      await resetScoresForWork(w.id);
      logAudit(ctxGroupId, 'reset_scores', `รีเซ็ตคะแนนทั้งหมดของผลงาน "${w.title}"`).catch(()=>{});
      renderWorksList();
    };
    const delBtn = tr.querySelector('button[data-id]');
    let confirming = false;
    let revertTimer = null;
    delBtn.onclick = async ()=>{
      if(!confirming){
        confirming = true;
        delBtn.textContent = 'ยืนยันการลบ?';
        delBtn.style.background = 'var(--red)';
        delBtn.style.color = '#fff';
        delBtn.style.borderColor = 'var(--red)';
        revertTimer = setTimeout(()=>{
          confirming = false;
          delBtn.textContent = 'ลบ';
          delBtn.style.background = '';
          delBtn.style.color = '';
          delBtn.style.borderColor = '';
        }, 4000);
        return;
      }
      clearTimeout(revertTimer);
      ctxWorks = ctxWorks.filter(x=>x.id!==w.id);
      await saveWorksFor(ctxGroupId, ctxWorks);
      logAudit(ctxGroupId, 'delete_work', `ลบผลงาน "${w.title}" (ผู้นำเสนอ: ${w.presenter||'-'})`).catch(()=>{});
      renderWorksTab();
    };
    tbody.appendChild(tr);
  }
}
