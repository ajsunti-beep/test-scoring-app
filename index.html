function renderScoreTab(){
  const body = document.getElementById('tabBody');
  if(ctxWorks.length===0){
    body.innerHTML = `<div class="card"><div class="empty">ยังไม่มีผลงานวิจัยในกลุ่มนี้ รอผู้ดูแลระบบเพิ่มผลงานก่อน</div></div>`;
    return;
  }
  const ej = effectiveJudge();
  if(ej){
    scoreJudge = ej;
    if(judgeScoreSubView === 'form' && scoreWorkId){
      renderJudgeScoreForm();
    } else {
      renderJudgeWorksList();
    }
    return;
  }

  if(!scoreWorkId) scoreWorkId = ctxWorks[0].id;
  const pickerHtml = `<div class="judge-picker" id="judgePicker">
        ${JUDGES.map(j=>`<button data-j="${j}" class="${j===scoreJudge?'active':''}">${escapeHtml(judgeLabel(j))}</button>`).join('')}
      </div>`;

  body.innerHTML = `
    <div class="card">
      <h2>เลือกกรรมการและผลงาน</h2>
      ${pickerHtml}
      <label class="field-label">รหัสผลงานวิจัยที่จะให้คะแนน</label>
      <select id="workSelect">
        ${ctxWorks.map(w=>`<option value="${w.id}" ${w.id===scoreWorkId?'selected':''}>${escapeHtml(w.title)}</option>`).join('')}
      </select>
    </div>
    <div id="rubricFormWrap"></div>
  `;
  body.querySelectorAll('#judgePicker button').forEach(b=>{
    b.onclick = async ()=>{
      scoreJudge = parseInt(b.dataset.j);
      body.querySelectorAll('#judgePicker button').forEach(x=>x.classList.toggle('active', x===b));
      await loadFormState();
    };
  });
  document.getElementById('workSelect').onchange = async (e)=>{
    scoreWorkId = e.target.value;
    await loadFormState();
  };
  loadFormState();
}

async function resetScoreForJudge(workId, judge){
  try{ await storage.delete(`score:${workId}:${judge}`, true); }catch(e){ /* ignore if already absent */ }
}
function renderJudgeWorksList(){
  const body = document.getElementById('tabBody');
  const showResetBtn = !!previewJudge && !ctxJudgeSignatures[previewJudge];
  let html = `<div class="card"><h2>ผลงานวิจัยที่ต้องประเมิน</h2>
    <div style="overflow-x:auto;">
    <table><thead><tr><th>ลำดับที่</th><th>รหัสผลงาน</th><th>ชื่อผู้วิจัย</th><th></th>${showResetBtn ? '<th></th>' : ''}</tr></thead><tbody>`;
  ctxWorks.forEach((w,i)=>{
    html += `<tr>
      <td>${i+1}</td>
      <td><strong>${escapeHtml(w.title)}</strong></td>
      <td>${escapeHtml(w.presenter||'-')}</td>
      <td><button class="btn btn-primary" data-score="${w.id}">ให้คะแนน</button></td>
      ${showResetBtn ? `<td><button class="btn btn-outline" style="color:var(--red);border-color:var(--red);" data-reset-judge="${w.id}">รีเซ็ตคะแนน</button></td>` : ''}
    </tr>`;
  });
  html += `</tbody></table></div></div>`;
  body.innerHTML = html;
  body.querySelectorAll('button[data-score]').forEach(btn=>{
    btn.onclick = ()=>{
      scoreWorkId = btn.dataset.score;
      judgeScoreSubView = 'form';
      renderJudgeScoreForm();
    };
  });
  if(showResetBtn){
    body.querySelectorAll('button[data-reset-judge]').forEach(btn=>{
      let confirming = false;
      let revertTimer = null;
      btn.onclick = async ()=>{
        if(!confirming){
          confirming = true;
          btn.textContent = 'ยืนยันรีเซ็ต?';
          btn.style.background = 'var(--red)';
          btn.style.color = '#fff';
          revertTimer = setTimeout(()=>{
            confirming = false;
            btn.textContent = 'รีเซ็ตคะแนน';
            btn.style.background = '';
            btn.style.color = '';
          }, 4000);
          return;
        }
        clearTimeout(revertTimer);
        const workId = btn.dataset.resetJudge;
        const w = ctxWorks.find(x=>x.id===workId);
        btn.textContent = 'กำลังรีเซ็ต...';
        btn.disabled = true;
        await resetScoreForJudge(workId, previewJudge);
        logAudit(ctxGroupId, 'reset_judge_score', `ผู้ดูแลระบบรีเซ็ตคะแนนของ ${judgeLabel(previewJudge)} สำหรับผลงาน "${w ? w.title : workId}"`).catch(()=>{});
        renderJudgeWorksList();
      };
    });
  }
}

function renderJudgeScoreForm(){
  const body = document.getElementById('tabBody');
  const work = ctxWorks.find(w=>w.id===scoreWorkId);
  body.innerHTML = `
    <a href="#" class="back-link" id="backToWorksList">← กลับไปยังรายการผลงาน</a>
    <div class="card">
      <h2>ให้คะแนน: ${escapeHtml(work ? work.title : '')}</h2>
      <p style="font-size:12.5px;color:var(--muted);margin:-6px 0 0;">ผู้วิจัย: ${escapeHtml((work && work.presenter) || '-')}</p>
    </div>
    <div id="rubricFormWrap"></div>
  `;
  document.getElementById('backToWorksList').onclick = (e)=>{ e.preventDefault(); confirmLeaveIfDirty(()=>{ judgeScoreSubView = 'list'; renderJudgeWorksList(); }); };
  loadFormState();
}

async function loadFormState(){
  const existing = await loadScore(scoreWorkId, scoreJudge);
  scoreLevels = existing ? {...existing.levels} : {};
  lastSavedScoreLevels = {...scoreLevels};
  renderRubricForm();
}

function renderRubricForm(){
  const wrap = document.getElementById('rubricFormWrap');
  if(!wrap) return;
  const lockedBySignature = !!ctxJudgeSignatures[scoreJudge];
  let html = '<div class="card">';
  if(lockedBySignature){
    html += `<div class="toast show" style="color:var(--red);background:var(--red-bg);border-radius:8px;padding:10px 14px;margin-bottom:14px;">
      🔒 ${escapeHtml(judgeLabel(scoreJudge))} ได้ลงลายมือชื่อรับรองผลการประเมินแล้ว จึงไม่สามารถแก้ไขคะแนนของกรรมการท่านนี้ได้อีก
      หากจำเป็นต้องแก้ไข กรุณาติดต่อผู้ดูแลระบบให้ยกเลิกการอนุมัติรับรองผลของกลุ่มนี้ก่อน (การยกเลิกจะล้างลายเซ็นของกรรมการทุกท่านในกลุ่ม)
    </div>`;
  }
  RUBRIC.forEach((dim)=>{
    const dimMax = dim.weight*3;
    html += `<div class="dim-block">
      <div class="dim-head"><h3>${dim.id.slice(1)}. ${escapeHtml(dim.name)}</h3><span>น้ำหนัก ${dim.weight} · เต็ม ${dimMax}</span></div>`;
    dim.indicators.forEach(ind=>{
      const cur = scoreLevels[ind.id];
      html += `<div class="indicator" data-ind="${ind.id}">
        <div class="ind-top"><strong>${ind.id} ${escapeHtml(ind.name)}</strong><span>น้ำหนัก ${ind.weight} · เต็ม ${ind.weight*3}</span></div>
        <p class="ind-desc">${escapeHtml(ind.desc)}</p>
        <div class="level-picker">
          ${LEVELS.map(l=>`<button class="level-btn ${cur===l.v?'active':''}" data-ind="${ind.id}" data-v="${l.v}" ${lockedBySignature?'disabled':''}>${l.label}<small>${l.sub}</small></button>`).join('')}
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  html += `</div>
    <div class="total-bar">
      <span class="lbl">คะแนนรวม</span>
      <span class="num" id="liveTotal">0</span>
    </div>
    <div style="text-align:center;">
      <span style="display:inline-flex;align-items:center;gap:32px;margin-top:14px;flex-wrap:wrap;justify-content:center;">
        ${lockedBySignature ? '' : `<button class="btn btn-gold" id="saveScoreBtn">บันทึกคะแนน</button>`}
        ${effectiveJudge() ? `<a href="#" class="back-link" id="backToWorksListBottom" style="margin-bottom:0;">← กลับไปยังรายการผลงาน</a>` : ''}
      </span>
      <div class="toast" id="scoreToast"></div>
    </div>
  `;
  wrap.innerHTML = html;

  const backBottom = document.getElementById('backToWorksListBottom');
  if(backBottom){
    backBottom.onclick = (e)=>{ e.preventDefault(); confirmLeaveIfDirty(()=>{ judgeScoreSubView = 'list'; renderJudgeWorksList(); }); };
  }

  if(lockedBySignature){
    updateLiveTotal();
    return;
  }

  wrap.querySelectorAll('.level-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const ind = btn.dataset.ind;
      const v = parseInt(btn.dataset.v);
      scoreLevels[ind] = v;
      wrap.querySelectorAll(`.level-btn[data-ind="${ind}"]`).forEach(b=>b.classList.toggle('active', parseInt(b.dataset.v)===v));
      updateLiveTotal();
    };
  });
  document.getElementById('saveScoreBtn').onclick = async ()=>{
    const toast = document.getElementById('scoreToast');
    const btn = document.getElementById('saveScoreBtn');
    toast.style.color = '';
    toast.innerHTML = '';
    if(ctxJudgeSignatures[scoreJudge]){
      toast.style.color = 'var(--red)';
      toast.textContent = `${judgeLabel(scoreJudge)} ได้ลงลายมือชื่อรับรองผลแล้ว ไม่สามารถบันทึกคะแนนเพิ่มเติมได้`;
      renderRubricForm();
      return;
    }
    const levelsSnapshot = {...scoreLevels};
    const filledCount = RUBRIC.reduce((n,dim)=>n+dim.indicators.filter(ind=>levelsSnapshot[ind.id]).length, 0);
    const totalIndicators = RUBRIC.reduce((n,dim)=>n+dim.indicators.length, 0);
    const complete = isComplete(levelsSnapshot);
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'กำลังบันทึก...';
    try{
      if(navigator.onLine === false){
        throw Object.assign(new Error('offline'), { code:'client/offline' });
      }
      await withTimeout(
        saveScore(scoreWorkId, scoreJudge, { levels: levelsSnapshot, total: computeTotal(levelsSnapshot), savedAt: new Date().toISOString() }),
        15000,
        'การบันทึกใช้เวลานานเกินไป'
      );
      lastSavedScoreLevels = levelsSnapshot;
      if(complete){
        toast.style.color = 'var(--green)';
        toast.textContent = `บันทึกคะแนนของ ${judgeLabel(scoreJudge)} เรียบร้อยแล้ว (รวม ${computeTotal(levelsSnapshot)} คะแนน)`;
      } else {
        toast.style.color = 'var(--orange)';
        toast.textContent = `บันทึกร่างคะแนนไว้แล้ว (กรอกแล้ว ${filledCount}/${totalIndicators} ตัวบ่งชี้) — กลับมาให้คะแนนต่อได้จนกว่าจะลงลายมือชื่อรับรองผล`;
      }
      const workNow = ctxWorks.find(w=>w.id===scoreWorkId);
      if(workNow){
        pushRowsToSheets(ctxGroupId, 'Scores', SCORE_ROW_HEADERS, [buildScoreRow(ctxGroupName, workNow, judgeLabel(scoreJudge), levelsSnapshot)]).catch(()=>{});
        logAudit(ctxGroupId, 'save_score', `${judgeLabel(scoreJudge)} บันทึก${complete ? '' : 'ร่าง'}คะแนน "${workNow.title}" (${filledCount}/${totalIndicators} ตัวบ่งชี้)${complete ? ` รวม ${computeTotal(levelsSnapshot)} คะแนน` : ''}`).catch(()=>{});
      }
    }catch(err){
      toast.style.color = 'var(--red)';
      if(err && (err.code==='client/timeout' || err.code==='client/offline')){
        toast.textContent = 'สัญญาณอินเทอร์เน็ตช้าหรือขาดหาย กรุณาตรวจสอบ Wi-Fi/สัญญาณมือถือ แล้วกด "บันทึกคะแนน" อีกครั้ง (คะแนนที่เลือกไว้ยังอยู่ ไม่ต้องเลือกใหม่)';
      } else {
        const codeStr = err && err.code ? ` [รหัส: ${err.code}]` : (err && err.message ? ` [${err.message}]` : '');
        toast.textContent = `บันทึกคะแนนไม่สำเร็จ กรุณาลองใหม่อีกครั้ง${codeStr}`;
      }
      console.error('score save failed:', err);
    }
    btn.disabled = false;
    btn.textContent = original;
  };
  updateLiveTotal();
}

function updateLiveTotal(){
  const t = document.getElementById('liveTotal');
  if(t) t.textContent = computeTotal(scoreLevels);
}

  const blob = new Blob([standaloneHtml], { type: 'text/html;charset=utf-8' });
  const blobUrl = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = blobUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(blobUrl), 5000);

  if(btn){ btn.textContent = original; btn.disabled = false; }
}

/* ---------- summary tab ---------- */
async function renderSummaryTab(){
  const body = document.getElementById('tabBody');
  if(ctxWorks.length===0){
    body.innerHTML = `<div class="card"><div class="empty">ยังไม่มีผลงานวิจัยในกลุ่มนี้</div></div>`;
    return;
  }
  body.innerHTML = `<div class="card"><h2>กำลังโหลดคะแนน...</h2></div>`;

  ctxJudgeSignatures = await loadJudgeSignaturesFor(ctxGroupId);
  ctxCertifyApproved = await loadCertifyApprovedFor(ctxGroupId);

  const rows = [];
  const scoresByWorkSummary = await loadAllScoresForWorks(ctxWorks);
  for(const w of ctxWorks){
    const scores = scoresByWorkSummary[w.id];
    const result = computeWorkResult(scores);
    const nationalTotal = computeNationalTotal(w, result);
    const grade = nationalGrade(nationalTotal);
    rows.push({ work:w, scores, result, nationalTotal, grade });
  }
  rows.sort((a,b)=>{
    if(a.nationalTotal===null && b.nationalTotal===null) return 0;
    if(a.nationalTotal===null) return 1;
    if(b.nationalTotal===null) return -1;
    return b.nationalTotal - a.nationalTotal;
  });

  const ej = effectiveJudge();

  let signCard = '';
  if(ej){
    if(ctxJudgeSignatures[ej]){
      const signedDateStr = new Date(ctxJudgeSignatures[ej].at).toLocaleDateString('th-TH', { year:'numeric', month:'long', day:'numeric' });
      signCard = `<div class="card">
        <h2>การรับรองผลการประเมิน</h2>
        <p style="font-size:13px;color:var(--green);margin:0 0 12px;">คุณได้ลงลายมือชื่อรับรองผลแล้วเมื่อวันที่ ${signedDateStr}</p>
        <button class="btn btn-outline" id="resignBtn">ลงลายมือชื่อใหม่</button>
        <div id="signPanelWrap" style="margin-top:14px;"></div>
      </div>`;
    } else if(ctxCertifyApproved){
      signCard = `<div class="card">
        <h2>การรับรองผลการประเมิน</h2>
        <button class="btn btn-gold" id="openSignBtn">ลงลายมือชื่อรับรองผลการประเมิน</button>
        <div id="signPanelWrap" style="margin-top:14px;"></div>
      </div>`;
    }
  }

  let html = `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
      <h2>สรุปผลคะแนน (คะแนนเต็ม ${MAX_SCORE})</h2>
      <div style="text-align:right;flex-shrink:0;">
        <button class="btn btn-gold" id="pdfReportBtn">ดาวน์โหลดรายงานผล (PDF)</button>
      </div>
    </div>
    <div style="overflow-x:auto;">
    <table style="min-width:920px;"><thead><tr><th></th><th>รหัสผลงานวิจัย</th><th>สถานะ</th><th>คะแนนรวม</th><th>คะแนนระดับภูมิภาค</th><th>สรุปผลคะแนนระดับประเทศ</th><th>สรุปผลการประเมินระดับประเทศ</th><th>การรับรองผล</th><th></th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const res = r.result;
    let statusCell;
    if(res.resolved){
      statusCell = `<span class="badge badge-done">${res.allDone ? 'ครบและมีฐานนิยมทุกตัวบ่งชี้' : `สรุปผลได้แล้ว (${res.doneCount}/3 กรรมการ)`}</span>`;
    } else if(!res.allDone){
      statusCell = `<span class="badge badge-pending">ให้คะแนนแล้ว ${res.doneCount}/3</span>`;
    } else {
      statusCell = `<span class="badge badge-conflict"><span class="warn-icon" style="margin-right:4px;">!</span>ไม่มีฐานนิยม ${res.conflicts.length} ตัวบ่งชี้ · ต้องหารือ</span>`;
    }
    const regionalCell = (r.work.regionalScore!=null) ? r.work.regionalScore.toFixed(2) : '<span style="color:var(--muted)">ยังไม่ระบุ</span>';
    let nationalCell;
    if(r.nationalTotal!==null){
      nationalCell = `<span class="avg-total">${r.nationalTotal.toFixed(2)}</span>`;
    } else if(res.total===null){
      nationalCell = '<span style="color:var(--muted)">รอคะแนนรวม</span>';
    } else {
      nationalCell = '<span style="color:var(--muted)">รอคะแนนภูมิภาค</span>';
    }
    let gradeCell;
    if(r.grade === 'ไม่ผ่านเกณฑ์'){
      gradeCell = `<span class="badge badge-conflict">${r.grade}</span>`;
    } else if(r.grade){
      gradeCell = `<span class="badge badge-done">${r.grade}</span>`;
    } else {
      gradeCell = `<span style="color:var(--muted)">—</span>`;
    }
    let certCell;
    if(!ctxCertifyApproved){
      certCell = `<span style="color:var(--muted);font-size:12px;">${ej ? 'ยังไม่เปิดให้รับรอง' : 'ยังไม่อนุมัติให้รับรอง'}</span>`;
    } else if(ej){
      certCell = ctxJudgeSignatures[ej]
        ? `<span class="badge badge-done">รับรองแล้ว ✓</span>`
        : `<span style="color:var(--muted);font-size:12px;">รอคุณลงลายมือชื่อ</span>`;
    } else {
      const certCount = JUDGES.filter(n=>ctxJudgeSignatures[n]).length;
      certCell = certCount===3
        ? `<span class="badge badge-done">รับรองครบแล้ว 3/3</span>`
        : `<span class="badge badge-pending">รับรองแล้ว ${certCount}/3</span>`;
    }
    html += `<tr>
      <td>${r.nationalTotal!==null ? `<span class="rank-badge">${i+1}</span>` : ''}</td>
      <td><strong>${escapeHtml(r.work.title)}</strong><br><span style="color:var(--muted);font-size:12px;">${escapeHtml(r.work.presenter||'')}</span></td>
      <td>${statusCell}</td>
      <td>${res.total!==null ? `<span class="avg-total">${res.total}</span>` : '<span style="color:var(--muted)">—</span>'}</td>
      <td>${regionalCell}</td>
      <td>${nationalCell}</td>
      <td>${gradeCell}</td>
      <td>${certCell}</td>
      <td><button class="btn btn-ghost" style="color:var(--blue);border-color:var(--border)" data-detail="${r.work.id}">รายละเอียด</button></td>
    </tr>`;
    if(openDetailWorkId === r.work.id){
      html += `<tr><td colspan="9"><div class="detail-panel" id="detail-${r.work.id}"></div></td></tr>`;
    }
  });
  html += `</tbody></table></div></div>` + signCard;
  body.innerHTML = html;

  const pdfBtn = document.getElementById('pdfReportBtn');
  if(pdfBtn) pdfBtn.onclick = generatePdfReport;

  body.querySelectorAll('button[data-detail]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.detail;
      openDetailWorkId = openDetailWorkId===id ? null : id;
      renderSummaryTab();
    };
  });

  if(ej){
    const openBtn = document.getElementById('openSignBtn');
    const resignBtn = document.getElementById('resignBtn');
    const wrap = document.getElementById('signPanelWrap');
    const showPad = ()=>{
      let sigMode = 'draw'; // 'draw' | 'upload'
      let uploadedDataUrl = null;
      const render = ()=>{
        wrap.innerHTML = `
          <div class="sig-mode-toggle" style="display:flex;gap:8px;margin-bottom:10px;">
            <button class="btn ${sigMode==='draw' ? 'btn-gold' : 'btn-outline'}" id="sigModeDraw" type="button">วาดลายเซ็น</button>
            <button class="btn ${sigMode==='upload' ? 'btn-gold' : 'btn-outline'}" id="sigModeUpload" type="button">แนบไฟล์รูปภาพ</button>
          </div>
          ${sigMode==='draw' ? `
            <canvas id="sigCanvas" width="440" height="170" style="border:1px solid var(--border);border-radius:8px;background:#fff;touch-action:none;cursor:crosshair;display:block;max-width:100%;"></canvas>
            <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn btn-outline" id="sigClearBtn">ล้างลายเซ็น</button>
            </div>
          ` : `
            <input type="file" id="sigFileInput" accept="image/*" style="display:none;">
            <p style="font-size:11.5px;color:var(--muted);margin:0 0 10px;">รองรับไฟล์รูปภาพ (JPG, PNG) ถ่ายรูป เลือกจากคลังภาพ หรือลากไฟล์มาวางก็ได้ ขนาดไม่เกิน 8MB</p>
            <div id="sigDropZone" style="border:2px dashed var(--border);border-radius:8px;background:#fff;min-height:170px;display:flex;align-items:center;justify-content:center;padding:8px;cursor:pointer;transition:border-color .15s,background .15s;">
              <div id="sigFilePreviewWrap" style="text-align:center;">
                <span style="color:var(--muted);font-size:13px;">แตะเพื่อเลือกไฟล์ หรือลากรูปมาวางตรงนี้</span>
              </div>
            </div>
          `}
          <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-gold" id="sigConfirmBtn">ยืนยันการรับรองผล</button>
            <button class="btn btn-ghost" id="sigCancelBtn">ยกเลิก</button>
          </div>
          <div class="toast" id="sigToast"></div>
        `;
        document.getElementById('sigModeDraw').onclick = ()=>{ sigMode='draw'; render(); };
        document.getElementById('sigModeUpload').onclick = ()=>{ sigMode='upload'; render(); };
        document.getElementById('sigCancelBtn').onclick = ()=>{ wrap.innerHTML = ''; };
        if(sigMode==='draw'){
          setupSignaturePad('sigCanvas');
          document.getElementById('sigClearBtn').onclick = ()=> clearSignaturePad('sigCanvas');
        } else {
          const fileInput = document.getElementById('sigFileInput');
          const dropZone = document.getElementById('sigDropZone');
          const previewWrap = document.getElementById('sigFilePreviewWrap');
          const toast = document.getElementById('sigToast');
          let originalUploadDataUrl = null;
          let processedUploadDataUrl = null; // computed lazily, only when the checkbox is turned on
          let bgRemovalOn = false; // default: show the original attached image as-is
          let bgProcessing = false;
          const updatePreview = ()=>{
            const src = (bgRemovalOn && processedUploadDataUrl) ? processedUploadDataUrl : originalUploadDataUrl;
            uploadedDataUrl = src;
            previewWrap.innerHTML = `
              <div style="background-image:linear-gradient(45deg,#e5e5e5 25%,transparent 25%),linear-gradient(-45deg,#e5e5e5 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e5e5e5 75%),linear-gradient(-45deg,transparent 75%,#e5e5e5 75%);background-size:14px 14px;background-position:0 0,0 7px,7px -7px,-7px 0;border:1px solid var(--border);border-radius:8px;padding:8px;display:inline-block;">
                <img src="${src}" alt="ลายเซ็นที่แนบ" style="max-width:100%;max-height:200px;display:block;margin:0 auto;">
              </div>
              ${originalUploadDataUrl ? `
                <label id="sigBgToggleLabel" style="display:flex;align-items:center;gap:6px;justify-content:center;margin-top:8px;font-size:12.5px;color:var(--muted);cursor:${bgProcessing ? 'default' : 'pointer'};">
                  <input type="checkbox" id="sigBgToggle" ${bgRemovalOn ? 'checked' : ''} ${bgProcessing ? 'disabled' : ''}>
                  ${bgProcessing ? 'กำลังลบพื้นหลัง...' : 'ลบพื้นหลัง/ครอปให้พอดีอัตโนมัติ'}
                </label>
              ` : ''}
            `;
            // The preview (and this label) sit inside the dropzone, which opens
            // the native file picker on any click within it. Without stopping
            // propagation here, clicking the checkbox bubbles up to that
            // handler and pops the OS "Open file" dialog on top of the app.
            const bgToggleLabel = document.getElementById('sigBgToggleLabel');
            if(bgToggleLabel) bgToggleLabel.onclick = (e)=> e.stopPropagation();
            const bgToggle = document.getElementById('sigBgToggle');
            if(bgToggle) bgToggle.onchange = async (e)=>{
              bgRemovalOn = e.target.checked;
              if(bgRemovalOn && !processedUploadDataUrl){
                bgProcessing = true;
                updatePreview();
                try{
                  processedUploadDataUrl = await removeBackgroundAndCropDataURL(originalUploadDataUrl);
                }catch(err){
                  bgRemovalOn = false;
                }
                bgProcessing = false;
              }
              updatePreview();
            };
          };
          const handleFile = async (file)=>{
            toast.style.color = '';
            toast.textContent = '';
            if(!file) return;
            previewWrap.innerHTML = `<span style="color:var(--muted);font-size:13px;">กำลังโหลดรูป...</span>`;
            try{
              originalUploadDataUrl = await readImageFileToDataURL(file, 500);
              processedUploadDataUrl = null;
              bgRemovalOn = false;
              updatePreview();
            }catch(err){
              uploadedDataUrl = null;
              originalUploadDataUrl = null;
              processedUploadDataUrl = null;
              previewWrap.innerHTML = `<span style="color:var(--muted);font-size:13px;">แตะเพื่อเลือกไฟล์ หรือลากรูปมาวางตรงนี้</span>`;
              toast.style.color = 'var(--red)';
              if(err && err.code==='client/invalid-file-type') toast.textContent = 'กรุณาเลือกไฟล์รูปภาพเท่านั้น (JPG, PNG)';
              else if(err && err.code==='client/file-too-large') toast.textContent = 'ไฟล์ใหญ่เกินไป กรุณาเลือกไฟล์ไม่เกิน 8MB';
              else toast.textContent = 'ไม่สามารถอ่านไฟล์รูปภาพนี้ได้ กรุณาลองไฟล์อื่น';
            }
          };
          dropZone.onclick = ()=> fileInput.click();
          fileInput.onchange = (e)=> handleFile(e.target.files && e.target.files[0]);
          let dragCounter = 0;
          dropZone.ondragover = (e)=>{ e.preventDefault(); };
          dropZone.ondragenter = (e)=>{
            e.preventDefault();
            dragCounter++;
            dropZone.style.borderColor = 'var(--orange)';
            dropZone.style.background = 'var(--orange-light)';
          };
          dropZone.ondragleave = (e)=>{
            e.preventDefault();
            dragCounter = Math.max(0, dragCounter-1);
            if(dragCounter===0){
              dropZone.style.borderColor = 'var(--border)';
              dropZone.style.background = '#fff';
            }
          };
          dropZone.ondrop = (e)=>{
            e.preventDefault();
            dragCounter = 0;
            dropZone.style.borderColor = 'var(--border)';
            dropZone.style.background = '#fff';
            const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
            if(file) handleFile(file);
          };
        }
        document.getElementById('sigConfirmBtn').onclick = async ()=>{
          const toast = document.getElementById('sigToast');
          toast.style.color = '';
          toast.textContent = '';
          let dataUrl;
          if(sigMode==='draw'){
            if(isSignaturePadEmpty('sigCanvas')){
              toast.style.color = 'var(--red)';
              toast.textContent = 'กรุณาลงลายมือชื่อก่อนยืนยัน';
              return;
            }
            dataUrl = trimCanvasToDataURL('sigCanvas');
          } else {
            if(!uploadedDataUrl){
              toast.style.color = 'var(--red)';
              toast.textContent = 'กรุณาแนบไฟล์รูปลายเซ็นก่อนยืนยัน';
              return;
            }
            dataUrl = uploadedDataUrl;
          }
          const confirmBtn = document.getElementById('sigConfirmBtn');
          confirmBtn.disabled = true;
          confirmBtn.textContent = 'กำลังบันทึก...';
          const prevSignatures = { ...ctxJudgeSignatures };
          const newSigEntry = { signature: dataUrl, at: Date.now() };
          try{
            if(navigator.onLine === false){
              throw Object.assign(new Error('offline'), { code:'client/offline' });
            }
            const merged = await withTimeout(
              saveJudgeSignatureAtomic(ctxGroupId, ej, newSigEntry),
              15000,
              'การบันทึกใช้เวลานานเกินไป'
            );
            ctxJudgeSignatures = merged;
            logAudit(ctxGroupId, 'sign', `${judgeLabel(ej)} ลงลายมือชื่อรับรองผลการประเมิน (${sigMode==='upload' ? 'แนบไฟล์รูปภาพ' : 'วาดลายเซ็น'})`).catch(()=>{});
            renderSummaryTab();
          }catch(err){
            ctxJudgeSignatures = prevSignatures;
            confirmBtn.disabled = false;
            confirmBtn.textContent = 'ยืนยันการรับรองผล';
            toast.style.color = 'var(--red)';
            if(err && (err.code==='client/timeout' || err.code==='client/offline')){
              toast.textContent = 'สัญญาณอินเทอร์เน็ตช้าหรือขาดหาย กรุณาตรวจสอบ Wi-Fi/สัญญาณมือถือ แล้วกด "ยืนยันการรับรองผล" อีกครั้ง (ลายเซ็น/ไฟล์ที่เลือกไว้ยังอยู่ ไม่ต้องทำใหม่)';
            } else {
              const codeStr = err && err.code ? ` [รหัส: ${err.code}]` : (err && err.message ? ` [${err.message}]` : '');
              toast.textContent = `บันทึกลายเซ็นไม่สำเร็จ กรุณาลองใหม่อีกครั้ง${codeStr}`;
            }
            console.error('signature save failed:', err);
          }
        };
      };
      render();
    };
    if(openBtn) openBtn.onclick = showPad;
    if(resignBtn) resignBtn.onclick = showPad;
  }

  if(openDetailWorkId){
    const r = rows.find(x=>x.work.id===openDetailWorkId);
    const panel = document.getElementById(`detail-${openDetailWorkId}`);
    if(r && panel){
      const res = r.result;
      const dash = '<span style="color:var(--muted)">-</span>';
      let dhtml = `<table class="score-detail-table" style="font-size:12px;"><thead><tr><th>ตัวบ่งชี้</th><th>${escapeHtml(judgeLabel(1))}</th><th>${escapeHtml(judgeLabel(2))}</th><th>${escapeHtml(judgeLabel(3))}</th><th>ฐานนิยม</th><th>คะแนน</th></tr></thead><tbody>`;
      res.indicators.forEach(ind=>{
        dhtml += `<tr style="${ind.conflict?'background:var(--red-bg)':''}">
          <td>${ind.conflict ? '<span class="warn-icon" title="ยังไม่มีฐานนิยม">!</span>' : ''}${ind.id} ${escapeHtml(ind.name)}</td>
          <td style="text-align:center">${ind.judgeLevels[0]!=null ? ind.judgeLevels[0] : dash}</td>
          <td style="text-align:center">${ind.judgeLevels[1]!=null ? ind.judgeLevels[1] : dash}</td>
          <td style="text-align:center">${ind.judgeLevels[2]!=null ? ind.judgeLevels[2] : dash}</td>
          <td style="text-align:center">${ind.mode!==null ? ind.mode : (ind.conflict ? '<span style="color:var(--red);font-weight:600">ไม่มี</span>' : '<span style="color:var(--muted)">รอ</span>')}</td>
          <td style="text-align:center">${ind.score!==null ? ind.score : (ind.conflict ? '<span style="color:var(--red)">ต้องหารือ</span>' : '<span style="color:var(--muted)">รอ</span>')}</td>
        </tr>`;
      });
      dhtml += `</tbody></table>`;
      if(!res.resolved && !res.allDone){
        dhtml += `<div style="margin-top:8px;color:var(--muted);font-size:12px;">ให้คะแนนแล้ว ${res.doneCount}/3 คน — ตัวบ่งชี้ที่กรรมการยังให้คะแนนไม่ตรงกันจะรอฐานนิยมเมื่อกรรมการที่เหลือให้คะแนน</div>`;
      } else if(res.resolved && !res.allDone){
        dhtml += `<div style="margin-top:8px;color:var(--green);font-size:12px;">สรุปผลได้แล้วจากกรรมการ ${res.doneCount}/3 คน (มีฐานนิยมตรงกันทุกตัวบ่งชี้)</div>`;
      }
      dhtml += `<div class="detail-row" style="margin-top:8px;"><span>คะแนนรวม</span><span>${res.total!==null ? res.total+' / '+MAX_SCORE : (res.conflicts.length>0 ? 'รอกรรมการปรับคะแนนตัวบ่งชี้ที่ไม่มีฐานนิยม' : `รอกรรมการ (${res.doneCount}/3)`)}</span></div>`;
      panel.innerHTML = dhtml;
    }
  }
}

/* ---------- init ---------- */
(async function init(){
  const headerLogoEl = document.getElementById('headerLogo');
  if(headerLogoEl) headerLogoEl.src = LOGO_DATA_URI;

  await loadGroups();
  await loadVisitors();
  await loadSuperAdmins();
  await loadUsernameMap();
  await loadEvalYear();

  const params = new URLSearchParams(window.location.search);
  const urlGroup = params.get('group');
  const urlJudge = params.get('judge');
  if(urlGroup && ['1','2','3'].includes(urlJudge) && groups.some(g=>g.id===urlGroup)){
    const g = groups.find(g=>g.id===urlGroup);
    await enterGroup(g.id, g.name);
    lockedGroupId = g.id;
    lockedJudge = parseInt(urlJudge);
    currentTab = 'score';
  }

  fsAuth.onAuthStateChanged((user)=>{
    authUser = user;
    authReady = true;
    renderApp();
  });

  renderApp();
})();
</script>
